<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Is the Sky Blue?</title>
<meta name="description" content="An 86-second paper-craft animation explaining Rayleigh scattering.">
<style>
  :root { --bg:#141312; --fg:#F3EAD8; --muted:#9A9388; --accent:#E8765A; --panel:#211F1D; --line:#34312D; }
  * { box-sizing:border-box; }

  .wrap { max-width:1280px; margin:0 auto; padding:24px 16px 40px; }

  header p { margin:0 0 16px; color:var(--muted); }
  canvas { display:block; width:100%; height:auto; aspect-ratio:16/9; border-radius:10px; background:#1D1C1A; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
  button { font:inherit; color:var(--fg); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; min-height:40px; }

  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input[type=range] { flex:1 1 200px; accent-color:var(--accent); min-height:40px; }

  body.render { background:#1D1C1A; overflow:hidden; }
  body.render .wrap { max-width:none; padding:0; }
  body.render header, body.render .controls, body.render footer { display:none; }
  body.render canvas { width:1920px; height:1080px; border-radius:0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Why Is the Sky Blue?</h1>
    <p>An 86-second lesson on Rayleigh scattering, made from torn paper. <a href="STORYBOARD.md" style="color:inherit">Storyboard &amp; script</a></p>
  </header>
  <canvas id="c" width="1920" height="1080" role="img" aria-label="Animation: why the sky is blue"></canvas>
  <div class="controls">
    <button id="play" aria-label="Play">▶ Play</button>
    <input id="scrub" type="range" min="0" max="86" step="0.0417" value="0" aria-label="Seek">
    <span class="time" id="time">0:00 / 1:26</span>
    <button id="cc" aria-pressed="true">CC</button>
    <button id="snd" aria-pressed="true">Sound</button>
    <button id="vo" aria-pressed="false" title="Uses your browser's built-in voice">Narrate</button>
  </div>
  <footer>Space: play/pause · ←/→: 5 s · The rendered MP4 lives in <code>render/out/</code>.</footer>
</div>
<script>

/* ===================================================================

  coral:'#E8765A', mustard:'#E3B23C', teal:'#3E9C9A', cream:'#F3EAD8', char:'#2B2926',

  { t:21.4, text:"To reach your eyes, it has to cross the air: trillions of nitrogen and oxygen molecules, far smaller than any wave." },

fx(33.43, 'tok'); fx(37.6, 'tick', .8); fx(39.89, 'pings');
fx(42.7, 'tick', .6); fx(43.4, 'tick', .7); fx(44.0, 'tick', .8); fx(44.9, 'tick', .9); fx(45.25, 'pop', .8); fx(45.6, 'whoosh', .7);

// Wind ambience level keyframes [time, gain]; thins inside the molecule close-ups.
const WIND = [[0, 0], [1, 1], [20, 1], [22, .35], [46, .35], [48, 1], [74, .8], [84, .5], [86, 0]];
const TIMELINE = { fps:FPS, duration:DUR, width:W, height:H, scenes:SCENES, vo:VO, captions:CAPTIONS, sfx:SFX, music:MUSIC, wind:WIND, secPerWord:SEC_PER_WORD };

/* ===================================================================

   =================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

/* ===================================================================

   =================================================================== */

      c.save(); c.setLineDash([14, 12]); c.lineDashOffset = -T * 70;
      c.strokeStyle = C.teal; c.globalAlpha = pa; c.lineWidth = 5; c.lineCap = 'round';
      c.beginPath(); c.moveTo(m.x + ux * 20, m.y + uy * 20); c.lineTo(m.x + ux * end, m.y + uy * end); c.stroke(); c.restore();
      const ring = (u - ts) % 1.6 / 1.6;
      c.save(); c.globalAlpha = pa * .5 * (1 - ring); c.strokeStyle = C.teal; c.lineWidth = 3;
      c.beginPath(); c.arc(m.x, m.y, 16 + ring * 30, 0, TAU); c.stroke(); c.restore();
    }
    molecule(c, m.x, m.y, 10 * k, molAng() + i, 520 + i * 3, C.char, 1 - ex * .6);
  });
  let look = [0, -1];
  if (u > 3 && u < 4.5) look = [-1, -1]; else if (u >= 4.5 && u < 6) look = [0, -1]; else if (u >= 6 && u < 7.5) look = [1, -1];
  if (u < 2.4) look = [-1, 0];
  pip(c, px, 706, { walk: u > .4 && u < 2.4, look, hop: bump(u, 7.6, 8.1), warm: ex * .5 });
  const va = seg(u, 8.6, 9.1) * (1 - seg(u, 14.0, 14.5));
  if (va > 0) {
    const dy = (1 - eBack(seg(u, 8.6, 9.2))) * 60;
    paper(c, rectPts(70, 560 + dy, 470, 190), C.cream, 560, { alpha: va, torn: 3, step: 22 });
    ribbon(c, wavePts(100, 230, () => 610 + dy, 8, 26, 100, 3), C.violet, 7, 562, va);
    label(c, 'violet?', 250, 610 + dy, { alpha: va, size: 26, weight: 700, color: C.violet });
    label(c, '− less in sunlight', 100, 660 + dy, { alpha: va * seg(u, 10.6, 11), size: 24 });
    label(c, '− eyes less keen', 100, 705 + dy, { alpha: va * seg(u, 12.6, 13), size: 24 });
    // tiny pencil eye
    const ex0 = 470, ey0 = 705 + dy;
    pencil(c, [[ex0 - 30, ey0], [ex0, ey0 - 14], [ex0 + 30, ey0], [ex0, ey0 + 14], [ex0 - 30, ey0]], 566, va * seg(u, 12.6, 13));
    c.save(); c.globalAlpha = va * seg(u, 12.6, 13); c.fillStyle = C.char; c.beginPath(); c.arc(ex0, ey0, 6, 0, TAU); c.fill(); c.restore();
  }
}

/* ===================================================================
   Scene 6 — consequence (63–75 s): the long evening path
   =================================================================== */
const EC = [900, 2400], ER = 1850, AR = 2030;
const SS0 = [120, 530], SS1 = [880, 482];         // sunset path, inside the atmosphere band
function pathCol(f) { return f < .5 ? mix(C.white, C.mustard, f * 2) : mix(C.mustard, C.coral, (f - .5) * 2); }
function diagram(c, o) {
  const dy = (1 - eBack(o.rise ?? 1)) * 460, warm = o.warm || 0, day = o.day || 0;
  const g = c.createLinearGradient(0, 0, 0, SH);
  g.addColorStop(0, mix(mix(C.paper2, C.teal, day * .45), C.coral, warm * .45));
  g.addColorStop(1, mix(mix(C.paper2, C.teal, day * .2), C.mustard, warm * .5));
  c.fillStyle = g; c.fillRect(0, 0, SW, SH);
  paper(c, circlePts(EC[0], EC[1] + dy, AR, 220), mix(mix(C.teal, C.cream, .6), C.mustard, warm * .35), 600, { torn: 4, step: 40, alpha: .92, blur: 18, sh: .15 });
  paper(c, circlePts(EC[0], EC[1] + dy, ER, 220), mix(C.teal, C.char, .38), 604, { torn: 5, step: 40, gouache: true, streaks: 8 });
  label(c, 'air', 1500, 432 + dy, { alpha: o.labels ?? 0, size: 24, color: mix(C.teal, C.char, .5) });
  if (o.you) { c.save(); c.fillStyle = C.coral; c.fillRect(900 - 24, 550 + dy - 40, 48, 40); c.restore(); }
  const na = o.noon || 0;
  if (na > 0) {
    sunDisk(c, 900, 70 + dy * .2, 34, 0, na);
    beam(c, 900, 112, 900, lerp(112, 456 + dy, o.noonP ?? 1), 12, na);
    label(c, 'noon: short path', 940, 250, { alpha: na * (o.labels ?? 0), chip: true, size: 26 });
  }
  const sa = o.sunset || 0;
  if (sa > 0) {
    sunDisk(c, 60, 528 + dy, 58, 1, sa);
    const sp = o.sp || 0, N = 60;
    for (let i = 0; i < N; i++) {
      const f0 = i / N, f1 = (i + 1) / N; if (f0 >= sp) break;
      const f1c = Math.min(f1, sp);
      c.save(); c.globalAlpha = sa; c.lineCap = 'round'; c.strokeStyle = pathCol(f0); c.lineWidth = 14;
      c.beginPath(); c.moveTo(lerp(SS0[0], SS1[0], f0), lerp(SS0[1], SS1[1], f0) + dy); c.lineTo(lerp(SS0[0], SS1[0], f1c), lerp(SS0[1], SS1[1], f1c) + dy); c.stroke(); c.restore();
    }
    for (let i = 0; i < 8; i++) {                     // blue peeling away along the path
      const f = .12 + i * .1, age = (o.peelU ?? 0) - 3 * f;
      if (age <= 0 || age > 2.6) continue;
      const bx = lerp(SS0[0], SS1[0], f) + age * 14, by = lerp(SS0[1], SS1[1], f) + dy - 16 - age * 70;
      rayWave(c, bx, by, -1.2 - i * .1, 0, 50, C.teal, 24, 620 + i * 5, sa * (1 - age / 2.6), 5);
    }
    label(c, 'sunset: long path', 300, 440, { alpha: sa * (o.labels ?? 0), chip: true, size: 26 });
  }
}
function panelRect(side) { return { x: side ? 954 : 90, y: 200, s: .42 }; }
function drawPanel(c, px, py, s, o, frameA = 1, pulse = 0) {
  c.save();
  const pw = SW * s, ph = SH * s;
  c.translate(px + pw / 2, py + ph / 2); c.scale(1 + pulse * .035, 1 + pulse * .035); c.translate(-pw / 2, -ph / 2);
  if (frameA > 0) paper(c, rectPts(-16, -16, pw + 32, ph + 32), C.cream, o.id ?? 640, { alpha: frameA, torn: 3, step: 24, blur: 14 });
  c.save(); c.beginPath(); c.rect(0, 0, pw, ph); c.clip(); c.scale(s, s);
  diagram(c, o);
  c.restore();
  if (pulse > 0) { c.save(); c.globalAlpha = pulse; c.strokeStyle = o.day ? C.teal : C.coral; c.lineWidth = 6; c.strokeRect(-10, -10, pw + 20, ph + 20); c.restore(); }
  c.restore();
}
function s6(c, u) {
  const m = ease(seg(u, 1.2, 3.2)), fold = ease(seg(u, 10.2, 12));
  const labels = seg(u, 3.6, 4.1) * (1 - seg(u, 9.8, 10.3));
  const o = {
    rise: seg(u, 1.2, 3.2), warm: ease(seg(u, 8, 10)),
    noon: seg(u, 3.4, 3.9) * (1 - seg(u, 9.8, 10.4)), noonP: eOut(seg(u, 3.5, 4.4)),
    sunset: seg(u, 1.2, 2.2), sp: ease(seg(u, 5.6, 8.6)), peelU: u - 5.6, labels
  };
  const sunsetLabel = seg(u, 6, 6.5) * (1 - seg(u, 9.8, 10.3));
  if (fold <= 0) {
    diagram(c, { ...o, labels: 0 });
    label(c, 'noon: short path', 940, 250, { alpha: o.noon * labels, chip: true, size: 26 });
    label(c, 'sunset: long path', 300, 440, { alpha: sunsetLabel, chip: true, size: 26 });
    label(c, 'air', 1500, 432, { alpha: labels, size: 24, color: mix(C.teal, C.char, .5) });
  } else {
    bg(c, C.paper2);
    const L = panelRect(0), Rt = panelRect(1);
    drawPanel(c, lerp(-900, L.x, fold), L.y, L.s, { rise: 1, day: 1, noon: 1, noonP: 1, you: 1, id: 650 }, fold);
    const s = lerp(1, Rt.s, fold);
    drawPanel(c, lerp(0, Rt.x, fold), lerp(0, Rt.y, fold), s, { ...o, labels: 0, you: fold > .5, id: 660 }, fold);
  }
  if (m < 1) landscape(c, { sky: 1, eve: 1, sun: [lerp(140, 60, m), 540], sunA: 1 - m, lay: 1 - m, skyA: 1 - m });
  // Pip: from the hill, hops up onto the Earth diagram, then down below the panels
  const k1 = ease(seg(u, 2.0, 3.0)), k2 = ease(seg(u, 10.2, 11.2));
  let py = lerp(706, 550, k1) - Math.sin(Math.PI * k1) * 80;
  py = lerp(py, 790, k2) - Math.sin(Math.PI * k2) * 60;
  const look = u > 5.6 && u < 9 ? [-1, 0] : u >= 3.4 && u < 5.6 ? [0, -1] : [0, 0];
  pip(c, 900, py, { look, warm: 1 - ease(seg(u, 0, 2)) * .5 + ease(seg(u, 8.6, 9.5)) * .5, blink: (u > 9.0 && u < 9.15) || undefined });
}

/* ===================================================================
   Scene 7 — recap (75–86 s)
   =================================================================== */
function s7(c, u) {
  bg(c, C.paper2);
  const L = panelRect(0), Rt = panelRect(1);
  drawPanel(c, L.x, L.y, L.s, { rise: 1, day: 1, noon: 1, noonP: 1, you: 1, id: 650 }, 1, bump(u, 4.3, 5.1));
  drawPanel(c, Rt.x, Rt.y, Rt.s, { rise: 1, warm: 1, sunset: 1, sp: 1, peelU: 99, you: 1, id: 660 }, 1, bump(u, 6.4, 7.2));
  const ta = seg(u, .2, .7);
  label(c, 'day', L.x + 378, 150, { alpha: ta, align: 'center', size: 30, weight: 700, color: mix(C.teal, C.char, .3) });
  label(c, 'sunset', Rt.x + 378, 150, { alpha: ta, align: 'center', size: 30, weight: 700, color: mix(C.coral, C.char, .25) });
  const txt = 'short waves scatter most', n = Math.floor(txt.length * seg(u, .6, 2.6));
  c.save(); c.font = `700 44px ${MONO}`; const tw = c.measureText(txt).width; c.restore();
  const x0 = 900 - tw / 2;
  if (n > 0) label(c, txt.slice(0, n), x0, 70, { size: 44, weight: 700 });
  const ul = eOut(seg(u, 2.4, 3.2));
  if (ul > 0) crayon(c, [[x0 - 10, 106], [x0 - 10 + (tw + 20) * ul * .5, 102], [x0 - 10 + (tw + 20) * ul, 107]], C.mustard, 9, 700, 1);
  pip(c, 900, 790, { wave: u > 7.5 && u < 10, look: [0, 0] });
}

/* ===================================================================
   Terminal chrome + captions
   =================================================================== */
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
let showCaptions = true;
function chrome(c, t, sc) {
  c.fillStyle = C.term; c.fillRect(0, 0, W, H);
  c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 30; c.shadowOffsetY = 10;
  rrect(c, 30, 24, 1860, 1032, 18); c.fillStyle = C.win; c.fill(); c.restore();
  c.save(); rrect(c, 30, 24, 1860, 1032, 18); c.clip(); c.fillStyle = C.bar; c.fillRect(30, 24, 1860, 60); c.restore();
  [C.coral, C.mustard, C.teal].forEach((col, i) => { c.fillStyle = col; c.beginPath(); c.arc(66 + i * 30, 54, 8, 0, TAU); c.fill(); });
  c.font = `500 22px ${MONO}`; c.textBaseline = 'middle'; c.fillStyle = '#A8A195'; c.textAlign = 'center';
  c.fillText('sky.why — ~/lessons', W / 2, 54);
  c.textAlign = 'right'; c.fillStyle = '#7F786E';
  c.fillText(`${String(sc.n).padStart(2, '0')}/07 · ${sc.name}`, 1860, 54);
}
function captionBar(c, t) {
  const y = 992;
  c.font = `600 34px ${MONO}`; c.textBaseline = 'middle'; c.textAlign = 'left';
  c.fillStyle = C.mustard; c.fillText('›', 72, y);
  if (t >= 84) {
    const s = 'lesson complete ✓', n = Math.floor(s.length * seg(t, 84, 84.8));
    c.fillStyle = C.teal; c.fillText(s.slice(0, n), 112, y);
    return;
  }
  const cap = showCaptions && CAPTIONS.find(k => t >= k.start && t < k.end + .35);
  if (cap) { c.fillStyle = C.cream; c.fillText(cap.text, 112, y); }
  else if (Math.floor(t * 2) % 2 === 0) { c.fillStyle = C.cream; c.fillRect(112, y - 17, 18, 34); }
}
const SCENE_FN = [s1, s2, s3, s4, s5, s6, s7];
function renderFrame(t) {
  t = clamp(t, 0, DUR - 1e-6);
  T = t; BF = Math.floor(t * 8);
  const i = SCENES.findIndex(s => t >= s.start && t < s.end), sc = SCENES[i];
  chrome(ctx, t, sc);
  ctx.save(); ctx.translate(SX, SY); ctx.beginPath(); ctx.rect(0, 0, SW, SH); ctx.clip();
  SCENE_FN[i](ctx, t - sc.start);
  grain(ctx);
  const fo = seg(t, 85.1, 86);
  if (fo > 0) { ctx.globalAlpha = fo; bg(ctx, C.win); ctx.globalAlpha = 1; }
  ctx.restore();
  captionBar(ctx, t);
}
window.renderAt = t => { renderFrame(t); return true; };

/* ===================================================================
   Live audio (Web Audio) — the same cue list the offline mix uses
   =================================================================== */
let AC = null, master = null, windSrc = null, soundOn = true, narrate = false, voTimers = [];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function noiseBuf() { const b = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = hash(i) * 2 - 1; return b; }
let NB = null;
function env(g, t0, a, peak, dec) { g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + a + dec); }
function tone(t0, f, type, peak, dec, a = .005, f1 = null) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + a + dec);
  env(g, t0, a, peak, dec); o.connect(g).connect(master); o.start(t0); o.stop(t0 + a + dec + .05);
}
function noise(t0, dur, peak, type, f0, f1, q = 1) {
  const s = AC.createBufferSource(); s.buffer = NB; const fl = AC.createBiquadFilter(); fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f0, t0); fl.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0 + dur * .3); g.gain.linearRampToValueAtTime(0, t0 + dur);
  s.connect(fl).connect(g).connect(master); s.start(t0, R(t0 * 100) * 1.5); s.stop(t0 + dur + .05);
}
function playNote(n, t0) {
  const f = mtof(n.midi);
  if (n.inst === 'marimba') { tone(t0, f, 'sine', .22 * n.vel, .55); tone(t0, f * 4, 'sine', .05 * n.vel, .12); }
  else if (n.inst === 'bass') tone(t0, f, 'triangle', .25 * n.vel, 1.3, .01);
  else if (n.inst === 'pad') {
    [-6, 6].forEach(d => { const o = AC.createOscillator(), fl = AC.createBiquadFilter(), g = AC.createGain(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = d; fl.type = 'lowpass'; fl.frequency.value = 900;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.035 * n.vel, t0 + .5); g.gain.setValueAtTime(.035 * n.vel, t0 + n.dur - .3); g.gain.linearRampToValueAtTime(0, t0 + n.dur + .5);
      o.connect(fl).connect(g).connect(master); o.start(t0); o.stop(t0 + n.dur + .6); });
  }
}
function playFx(e, t0) {
  const g = e.gain;
  switch (e.type) {
    case 'slide': noise(t0, .38, .16 * g, 'lowpass', 2400, 500, .7); break;
    case 'pop': tone(t0, 900, 'sine', .22 * g, .09, .002, 300); break;
    case 'tok': tone(t0, 320, 'sine', .3 * g, .12, .002, 180); break;
    case 'tick': tone(t0, 2400, 'square', .03 * g, .03, .001); break;
    case 'ping': tone(t0, 1800 + R(t0 * 10) * 900, 'sine', .07 * g, .25); break;
    case 'pings': for (let i = 0; i < 10; i++) tone(t0 + i * .05, 1500 + i * 140, 'sine', .07 * g, .35); break;
    case 'chime': [1, 2.76, 5.4].forEach((r, i) => tone(t0, 880 * r, 'sine', .12 * g / (i + 1), 1.8)); break;
    case 'end': [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(t0 + i * .06, f, 'sine', .1 * g, 2.4)); break;
    case 'thwip': tone(t0, 300, 'sine', .15 * g, .18, .005, 1400); break;
    case 'hum': tone(t0, 110, 'triangle', .22 * g, 1.1, .08); break;
    case 'trill': for (let i = 0; i < 8; i++) tone(t0 + i * .07, i % 2 ? 1500 : 1200, 'sine', .06 * g, .09); break;
    case 'whoosh': noise(t0, 1.1, .2 * g, 'bandpass', 300, 3000, 1.2); break;
    case 'longwhoosh': noise(t0, 3.1, .16 * g, 'bandpass', 2600, 400, 1.4); break;
    case 'peel': noise(t0, .12, .18 * g, 'highpass', 3000, 5000, .8); break;
  }
}
function startAudio(from) {
  stopAudio();
  if (!soundOn) return;
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  NB = NB || noiseBuf();
  master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination);
  const now = AC.currentTime + .05;
  MUSIC.forEach(n => { if (n.t >= from) playNote(n, now + n.t - from); });
  SFX.forEach(e => { if (e.t >= from) playFx(e, now + e.t - from); });
  windSrc = AC.createBufferSource(); windSrc.buffer = NB; windSrc.loop = true;
  const wf = AC.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 420;
  const wg = AC.createGain(); wg.gain.setValueAtTime(0, now);
  WIND.forEach(([t, v]) => { if (t >= from) wg.gain.linearRampToValueAtTime(v * .05, now + t - from); });
  windSrc.connect(wf).connect(wg).connect(master); windSrc.start(now);
}
function stopAudio() {
  if (master) { try { master.disconnect(); } catch (e) {} master = null; }
  if (windSrc) { try { windSrc.stop(); } catch (e) {} windSrc = null; }
}
function startVO(from) {
  stopVO();
  if (!narrate || !('speechSynthesis' in window)) return;
  VO.forEach(v => {
    if (v.t + 1 < from) return;
    voTimers.push(setTimeout(() => { const s = new SpeechSynthesisUtterance(v.text); s.rate = 1.0; speechSynthesis.speak(s); }, Math.max(0, (v.t - from) * 1000)));
  });
}
function stopVO() { voTimers.forEach(clearTimeout); voTimers = []; if ('speechSynthesis' in window) speechSynthesis.cancel(); }

/* ===================================================================
   Player
   =================================================================== */
const params = new URLSearchParams(location.search);
let playing = false, t0 = 0, wall0 = 0, cur = +(params.get('t') || 0);
const $ = id => document.getElementById(id);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function draw() { renderFrame(cur); $('scrub').value = cur; $('time').textContent = `${fmt(cur)} / ${fmt(DUR)}`; }
function tick(now) {
  if (!playing) return;
  cur = t0 + (now - wall0) / 1000;
  if (cur >= DUR) { cur = DUR - .001; pause(); }
  // quantise to 24 fps so the browser shows exactly the frames the MP4 has
  const q = Math.floor(cur * FPS) / FPS;
  const save = cur; cur = q; draw(); cur = save;
  requestAnimationFrame(tick);
}
function play() {
  if (cur >= DUR - .05) cur = 0;
  playing = true; t0 = cur; wall0 = performance.now();
  $('play').textContent = '❚❚ Pause'; $('play').setAttribute('aria-label', 'Pause');
  startAudio(cur); startVO(cur); requestAnimationFrame(tick);
}
function pause() { playing = false; stopAudio(); stopVO(); $('play').textContent = '▶ Play'; $('play').setAttribute('aria-label', 'Play'); }
function seek(t) { cur = clamp(t, 0, DUR - .001); if (playing) { play(); } else draw(); }
if (params.has('render')) {
  document.body.classList.add('render');
  if (params.get('cc') === '0') showCaptions = false;
} else {
  $('play').onclick = () => playing ? pause() : play();
  $('scrub').oninput = e => seek(+e.target.value);
  $('cc').onclick = e => { showCaptions = !showCaptions; e.currentTarget.setAttribute('aria-pressed', showCaptions); if (!playing) draw(); };
  $('snd').onclick = e => { soundOn = !soundOn; e.currentTarget.setAttribute('aria-pressed', soundOn); if (playing) startAudio(cur); };
  $('vo').onclick = e => { narrate = !narrate; e.currentTarget.setAttribute('aria-pressed', narrate); if (playing) startVO(cur); };
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
    if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
    if (e.key === 'ArrowRight') seek(cur + 5);
    if (e.key === 'ArrowLeft') seek(cur - 5);
  });
}
draw();
