<!doctype html>
<html><head><meta charset="utf-8"><title>S09-B02 Change The Signals</title>
<link rel="stylesheet" href="../theme.css">
<style>
  #title { left:50%; top:90px; font-size:88px; }
  #sub { left:50%; top:200px; font-size:56px; }
  .chip { position:absolute; width:330px; height:330px; margin:-165px; border-radius:70px; text-align:center;
    box-shadow: inset 0 6px 0 rgba(255,255,255,.4), inset 0 -12px 0 rgba(0,0,0,.18), 0 24px 50px rgba(0,0,0,.45); }
  .chip .emoji { font-size:150px; display:block; margin-top:40px; }
  .chip .l { font:700 46px 'Fredoka'; margin-top:10px; }
  .bad { background:linear-gradient(160deg,#ff6b8a,#9b1030); }
  .x { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:260px; }
  #arrow { left:960px; top:560px; font-size:120px; color:#fff; }
</style></head>
<body><div id="stage">
  <div id="cells" class="layer"></div>
  <div id="title" class="abs h3d">YOUR BODY RESPONDS</div>
  <div id="sub" class="abs h3d">TO YOUR MORNING INPUTS</div>
  <div class="chip bad" id="c1" style="left:520px;top:420px"><span class="emoji">⚡</span><div class="l">STRESS</div><div class="x emoji" id="x1">❌</div></div>
  <div class="chip bad" id="c2" style="left:520px;top:800px"><span class="emoji">🍩</span><div class="l">SUGAR</div><div class="x emoji" id="x2">❌</div></div>
  <div id="arrow" class="abs h3d">➜</div>
  <div id="goods" class="layer"></div>
</div>
<script src="../lib.js"></script>
<script>
const cells = makeCells(16, [['#2ee6a8','#12997a'], ['#ff6b8a','#a3173f'], ['#ffd166','#c2551f']], 421, $('#cells'));
const G = [['💧','HYDRATION','#7fd3ff','#2a7bff',6.4, 1200, 420], ['☀️','LIGHT','#ffd166','#e89a1c',6.85, 1600, 420], ['🚶','MOVEMENT','#2ee6a8','#12997a',7.2, 1200, 800], ['🍳','PROTEIN','#ffd166','#ff9f43',7.8, 1600, 800]];
const goods = G.map(([e, l, c1, c2, at, x, y]) => { const d = el('div','chip',$('#goods'), `<span class="emoji">${e}</span><div class="l">${l}</div>`);
  css(d, { left: x + 'px', top: y + 'px', background: `linear-gradient(160deg,${c1},${c2})` }); return { d, at }; });
function render(t) {
  entryPunch(t); cells.update(t);
  css($('#title'), { transform: `translate(-50%,0) scale(${pop(t, .2, .45)})`, opacity: t > .2 ? 1 - ease.out(prog(t, 4.6, .3)) : 0 });
  css($('#sub'), { transform: `translate(-50%,0) scale(${pop(t, 1.2, .45)})`, opacity: t > 1.2 ? 1 - ease.out(prog(t, 4.6, .3)) : 0 });
  const c1 = pop(t, 5.3, .4), c2 = pop(t, 5.8, .4);
  $('#c1').style.transform = `scale(${c1})`; $('#c1').style.opacity = t > 5.3 ? 1 : 0;
  $('#c2').style.transform = `scale(${c2})`; $('#c2').style.opacity = t > 5.8 ? 1 : 0;
  const dim = ease.out(prog(t, 6.3, .4));
  ['#c1', '#c2'].forEach(c => { $(c).style.background = dim > .5 ? 'linear-gradient(160deg,#6a6190,#2b2168)' : ''; $$(c + ' > .emoji:not(.x), ' + c + ' > .l').forEach(e => e.style.opacity = 1 - dim * .6); });
  [['#x1', 6.3], ['#x2', 6.45]].forEach(([s, a]) => { const p = prog(t, a, .2); css($(s), { transform: `translate(-50%,-50%) scale(${t < a ? 0 : lerp(2, 1, ease.back(p))})`, opacity: t > a ? .95 : 0 }); });
  css($('#arrow'), { transform: `translate(-50%,-50%) scale(${pop(t, 6.2, .4)}) translateX(${Math.sin(t * 6) * 10}px)`, opacity: t > 6.2 ? 1 : 0 });
  for (const g of goods) css(g.d, { transform: `scale(${pop(t, g.at, .45)}) rotate(${Math.sin(t * 2 + g.at) * 3}deg)`, opacity: t > g.at ? 1 : 0 });
}
window.CLIP = { duration: 9.0, render, sfx: [
  [0, 'whoosh', {dur: .45}], [.2, 'pop', {freq: 520}], [1.2, 'pop', {freq: 620}], [4.6, 'whoosh', {dur: .4, vol: .3}],
  [5.3, 'buzz', {dur: .25, vol: .2}], [5.8, 'buzz', {dur: .25, vol: .2}], [6.3, 'impact', {vol: .5}], [6.2, 'whoosh', {dur: .4, vol: .3}],
  ...[6.4, 6.85, 7.2, 7.8].map((a, i) => [a, 'ding', {freq: 1047 + i * 260, dur: .6, vol: .25}]),
]};
</script></body></html>
