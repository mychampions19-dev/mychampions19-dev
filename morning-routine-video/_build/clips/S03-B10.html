<!doctype html>
<html><head><meta charset="utf-8"><title>S03-B10 Rehydrate First</title>
<link rel="stylesheet" href="../theme.css">
<style>
  #title { left:50%; top:80px; font-size:110px; }
  #glassWrap { left:560px; top:600px; width:340px; height:520px; margin:-260px 0 0 -170px; }
  #glass { position:absolute; inset:0; clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%); background:rgba(255,255,255,.12); }
  #gw { position:absolute; left:0; right:0; bottom:0; height:0; background:linear-gradient(#9be0ff, #2a7bff); }
  #rim { position:absolute; inset:0; clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%); border:0; box-shadow: inset 0 0 0 10px rgba(255,255,255,.8); }
  .ion { position:absolute; padding:10px 22px; border-radius:30px; font:700 42px 'Fredoka'; color:#1b1440; background:#fff; box-shadow:0 8px 20px rgba(0,0,0,.35); }
  .meter { position:absolute; left:1000px; width:720px; }
  .meter .lbl { font:700 56px 'Fredoka'; margin-bottom:14px; display:flex; justify-content:space-between; }
  .meter .bar { height:64px; border-radius:32px; background:rgba(255,255,255,.12); overflow:hidden; }
  .meter .fill { height:100%; width:0; border-radius:32px; background:linear-gradient(90deg,#2ee6a8,#12c48f); box-shadow:0 0 24px rgba(46,230,168,.7); }
  .tick { font-size:56px; }
</style></head>
<body><div id="stage">
  <div id="cells" class="layer"></div>
  <div id="title" class="abs h3d">HYDRATE FIRST <span class="emoji">💧</span></div>
  <div id="glassWrap" class="abs"><div id="glass"><div id="gw"></div></div><div id="rim"></div></div>
  <div id="ions" class="layer"></div>
  <div class="meter" id="m1" style="top:420px"><div class="lbl"><span><span class="emoji">⚡</span> ENERGY</span><span class="tick emoji" id="k1">✅</span></div><div class="bar"><div class="fill" id="f1"></div></div></div>
  <div class="meter" id="m2" style="top:640px"><div class="lbl"><span><span class="emoji">🍽️</span> APPETITE CONTROL</span><span class="tick emoji" id="k2">✅</span></div><div class="bar"><div class="fill" id="f2"></div></div></div>
</div>
<script src="../lib.js"></script>
<script>
const cells = makeCells(20, [['#7fd3ff','#2a7bff'], ['#2ee6a8','#12997a'], ['#9b5cff','#3d1c8f']], 151, $('#cells'));
const IONS = [['Na⁺', 380, 330], ['K⁺', 700, 300], ['Mg²⁺', 560, 250]];
const ions = IONS.map(([s, x, y], i) => { const d = el('div','ion',$('#ions'), s); return { d, x, y, at: 1.2 + i * .15 }; });
function render(t) {
  entryPunch(t); cells.update(t);
  const tp = pop(t, .1, .45);
  css($('#title'), { transform: `translate(-50%,0) scale(${tp})`, opacity: t > .1 ? 1 : 0 });
  $('#glassWrap').style.transform = `scale(${pop(t, .2, .5)})`;
  $('#gw').style.height = (ease.inOut(prog(t, .5, 2.2)) * 88) + '%';
  for (const o of ions) {
    const p = pop(t, o.at, .4), drop = ease.in(prog(t, o.at + .6, .6));
    css(o.d, { left: o.x + 'px', top: (o.y + drop * 330) + 'px', transform: `translate(-50%,-50%) scale(${p * (1 - drop * .6)})`, opacity: t > o.at ? 1 - drop * .8 : 0 });
  }
  $('#m1').style.opacity = t > .6 ? 1 : 0; $('#m2').style.opacity = t > .8 ? 1 : 0;
  $('#m1').style.transform = `translateX(${lerp(200, 0, ease.out(prog(t, .6, .4)))}px)`;
  $('#m2').style.transform = `translateX(${lerp(200, 0, ease.out(prog(t, .8, .4)))}px)`;
  $('#f1').style.width = (ease.inOut(prog(t, 1.6, 1.3)) * 100) + '%';
  $('#f2').style.width = (ease.inOut(prog(t, 1.9, 1.3)) * 100) + '%';
  $('#k1').style.transform = `scale(${pop(t, 2.95, .35)})`; $('#k2').style.transform = `scale(${pop(t, 3.25, .35)})`;
}
window.CLIP = { duration: 6.3, render, sfx: [
  [0, 'whoosh', {dur: .45}], [.1, 'pop', {freq: 600}], [.5, 'whoosh', {dur: 2.0, vol: .18}],
  [1.2, 'pop', {freq: 900, vol: .3}], [1.35, 'pop', {freq: 1000, vol: .3}], [1.5, 'pop', {freq: 1100, vol: .3}],
  [1.6, 'riser', {dur: 1.3, vol: .12}], [2.95, 'ding', {freq: 1319, dur: .8, vol: .28}], [3.25, 'ding', {freq: 1568, dur: 1.0, vol: .28}],
]};
</script></body></html>
