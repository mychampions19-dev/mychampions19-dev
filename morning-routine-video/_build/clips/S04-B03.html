<!doctype html>
<html><head><meta charset="utf-8"><title>S04-B03 Circadian Clock</title>
<link rel="stylesheet" href="../theme.css">
<style>
  #title { left:50%; top:60px; font-size:88px; }
  #dialWrap { left:700px; top:590px; width:0; height:0; }
  #dial { position:absolute; left:-330px; top:-330px; width:660px; height:660px; overflow:visible; }
  .tag { position:absolute; transform:translate(-50%,-50%); white-space:nowrap; }
  .tag .pill { font-size:42px; }
  #ins { left:1440px; top:560px; width:900px; margin-left:-450px; text-align:center; white-space:nowrap; }
  #insIcon { font-size:170px; line-height:1; }
  #insName { font-size:110px; margin:10px 0 20px; }
</style></head>
<body><div id="stage">
  <div id="cells" class="layer"></div>
  <div id="title" class="abs h3d">YOUR MASTER CLOCK</div>
  <div id="dialWrap" class="abs">
    <svg id="dial" viewBox="-330 -330 660 660">
      <defs><linearGradient id="dayN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset=".5" stop-color="#ff9f43"/><stop offset=".5" stop-color="#3d2a8a"/><stop offset="1" stop-color="#1b0f45"/></linearGradient></defs>
      <circle r="300" fill="url(#dayN)" stroke="rgba(255,255,255,.8)" stroke-width="12"/>
      <circle r="230" fill="#140a33"/>
      <path id="insArc" d="" fill="none" stroke="#2ee6a8" stroke-width="40" stroke-linecap="round" style="filter:drop-shadow(0 0 16px #2ee6a8)"/>
      <g id="ticks"></g>
      <text y="-250" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="34" fill="#3a2300">NOON</text>
      <text y="272" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="34" fill="#fff">MIDNIGHT</text>
      <g id="hand"><line x1="0" y1="0" x2="0" y2="-200" stroke="#fff" stroke-width="16" stroke-linecap="round"/><circle r="26" fill="#fff"/></g>
    </svg>
    <div id="sunI" class="emoji" style="position:absolute;font-size:90px;transform:translate(-50%,-50%)">☀️</div>
    <div id="moonI" class="emoji" style="position:absolute;font-size:80px;transform:translate(-50%,-50%)">🌙</div>
  </div>
  <div id="tCort" class="tag"><span class="pill" style="background:linear-gradient(135deg,#ffd166,#ff9f43);color:#3a2300"><span class="emoji">⏰</span> CORTISOL · MORNING</span></div>
  <div id="tMel" class="tag"><span class="pill" style="background:linear-gradient(135deg,#7f6bff,#3d2a8a)"><span class="emoji">😴</span> MELATONIN · NIGHT</span></div>
  <div id="tIns" class="tag"><span class="pill" style="background:linear-gradient(135deg,#2ee6a8,#12997a)"><span class="emoji">🔑</span> INSULIN SENSITIVITY</span></div>
  <div id="ins" class="abs"><div id="insIcon" class="emoji">🔑</div><div id="insName" class="h3d">INSULIN</div>
    <span class="pill" style="font-size:42px;background:linear-gradient(135deg,#3d6bff,#9b5cff)">YOUR MAIN FAT-STORAGE HORMONE</span></div>
</div>
<script src="../lib.js"></script>
<script>
const cells = makeCells(18, [['#ffd166','#c2551f'], ['#9b5cff','#3d1c8f'], ['#2ee6a8','#12997a']], 161, $('#cells'));
// 24h dial: noon at top, midnight at bottom → angle(h) = (h-12)/24*360 deg from top
const ang = h => (h - 12) / 24 * 2 * Math.PI;
const P = (h, r) => [Math.sin(ang(h)) * r, -Math.cos(ang(h)) * r];
let tk = ''; for (let h = 0; h < 24; h++) { const [x1, y1] = P(h, 245), [x2, y2] = P(h, h % 6 ? 262 : 285);
  tk += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(255,255,255,.6)" stroke-width="${h % 6 ? 4 : 8}" stroke-linecap="round"/>`; }
$('#ticks').innerHTML = tk;
function arc(h0, h1, r) { const [x0, y0] = P(h0, r), [x1, y1] = P(h1, r); const large = (h1 - h0) > 12 ? 1 : 0; return `M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}`; }
const [sx, sy] = P(7, 330), [mx, my] = P(22, 330);
css($('#sunI'), { left: sx + 'px', top: sy + 'px' }); css($('#moonI'), { left: mx + 'px', top: my + 'px' });
const DX = 700, DY = 590;
css($('#tCort'), { left: (DX + P(7, 420)[0]) + 'px', top: (DY + P(7, 420)[1] - 40) + 'px' });
css($('#tMel'), { left: (DX + P(22, 420)[0] + 40) + 'px', top: (DY + P(22, 420)[1] + 30) + 'px' });
css($('#tIns'), { left: DX + 'px', top: '240px' });
function render(t) {
  entryPunch(t); cells.update(t);
  const tp = pop(t, .05, .45);
  css($('#title'), { transform: `translate(-50%,0) scale(${tp})`, opacity: (t > .05 ? 1 : 0) * (1 - ease.out(prog(t, 5.5, .3))) });
  const dp = pop(t, .1, .6), slide = ease.inOut(prog(t, 7.4, .6));
  $('#dialWrap').style.transform = `translateX(${lerp(260, 0, ease.out(prog(t, .1, .01))) * 0}px) scale(${dp * lerp(1, .85, slide)})`;
  $('#hand').setAttribute('transform', `rotate(${(6 + t * 1.6) / 24 * 360 - 180})`);
  css($('#sunI'), { transform: `translate(-50%,-50%) scale(${pop(t, 1.85, .4)})` });
  css($('#moonI'), { transform: `translate(-50%,-50%) scale(${pop(t, 3.0, .4)})` });
  css($('#tCort'), { transform: `translate(-50%,-50%) scale(${pop(t, 1.9, .4)})`, opacity: t > 1.9 ? 1 - slide : 0 });
  css($('#tMel'), { transform: `translate(-50%,-50%) scale(${pop(t, 3.05, .4)})`, opacity: t > 3.05 ? 1 - slide : 0 });
  const ia = ease.inOut(prog(t, 6.0, 1.1));
  $('#insArc').setAttribute('d', ia > 0 ? arc(6, 6 + ia * 12, 196) : '');
  css($('#tIns'), { transform: `translate(-50%,-50%) scale(${pop(t, 6.2, .4)})`, opacity: t > 6.2 ? 1 : 0 });
  const ip = pop(t, 7.7, .5);
  css($('#ins'), { transform: `scale(${ip})`, opacity: t > 7.7 ? 1 : 0 });
  $('#insIcon').style.transform = `rotate(${Math.sin(t * 3) * 10}deg)`;
}
window.CLIP = { duration: 10.4, render, sfx: [
  [0, 'whoosh', {dur: .45}], [.05, 'pop', {freq: 520}], [.1, 'pop', {freq: 400}],
  ...Array.from({length: 20}, (_, i) => [.6 + i * .5, 'tick', {vol: .12}]),
  [1.85, 'ding', {freq: 1568, dur: .8, vol: .25}], [3.0, 'ding', {freq: 784, dur: 1.0, vol: .25}],
  [6.0, 'riser', {dur: 1.1, vol: .14}], [6.2, 'pop', {freq: 700}], [7.7, 'impact', {vol: .55}], [7.75, 'pop', {freq: 520}],
]};
</script></body></html>
