<!doctype html>
<html><head><meta charset="utf-8"><title>S07-B02 Stress Stack</title>
<link rel="stylesheet" href="../theme.css">
<style>
  #tower { left:960px; top:960px; width:0; height:0; }
  .blk { position:absolute; left:-400px; width:800px; height:150px; border-radius:40px; display:flex; align-items:center; gap:26px; padding-left:40px;
    box-shadow: inset 0 6px 0 rgba(255,255,255,.35), inset 0 -12px 0 rgba(0,0,0,.2), 0 20px 40px rgba(0,0,0,.45); font:700 48px 'Fredoka'; white-space:nowrap; }
  .blk .emoji { font-size:90px; }
  #brain { left:1620px; top:430px; font-size:200px; }
  #redwash { position:absolute; inset:0; background:radial-gradient(circle at 50% 70%, rgba(255,59,92,.45), rgba(255,59,92,0) 65%); opacity:0; }
  #plus { left:300px; top:430px; font-size:140px; }
</style></head>
<body><div id="stage">
  <div id="cells" class="layer"></div><div id="redwash"></div>
  <div id="tower" class="abs"></div>
  <div id="brain" class="abs emoji">🧠</div>
</div>
<script src="../lib.js"></script>
<script>
const cells = makeCells(16, [['#ff6b6b','#b3122e'], ['#9b5cff','#3d1c8f']], 331, $('#cells'));
const B = [['📱','PHONE ALERTS','#7fa0ff','#3d5bd9',.75], ['☕','CAFFEINE, EMPTY STOMACH','#c98b5a','#7a4a26',1.95], ['🌑','RUSHING IN THE DARK','#6a6190','#2b2168',3.3], ['⏰','STRESS BEFORE 8 AM','#ff6b8a','#c0213a',4.75]];
const blks = B.map(([e, l, c1, c2, at], i) => { const d = el('div','blk',$('#tower'), `<span class="emoji">${e}</span>${l}`); d.style.background = `linear-gradient(135deg,${c1},${c2})`; return { d, at, i }; });
function render(t) {
  entryPunch(t); cells.update(t);
  const n = blks.filter(b => t > b.at).length;
  const wob = n >= 3 ? Math.sin(t * 7) * (n - 2) * 2.5 : 0;
  for (const b of blks) {
    const k = ease.out(prog(t, b.at, .45)), land = t > b.at + .45;
    const y = -170 * (b.i + 1);
    css(b.d, { top: lerp(-1200, y, ease.back(prog(t, b.at, .5))) + 'px', transform: `rotate(${(land ? wob * (b.i + 1) * .5 : (1 - k) * 20)}deg)`, opacity: t > b.at ? 1 : 0 });
  }
  $('#tower').style.transform = `rotate(${wob * .6}deg)`;
  $('#redwash').style.opacity = Math.min(1, n / 4) * (.6 + Math.sin(t * 9) * .2);
  css($('#brain'), { transform: `translate(-50%,-50%) scale(${pop(t, .1, .45) * (1 + n * .04)}) translateX(${n >= 3 ? Math.sin(t * 50) * n : 0}px)`, filter: `hue-rotate(${-n * 8}deg) saturate(${1 + n * .3})` });
}
window.CLIP = { duration: 6.8, render, sfx: [
  [0, 'whoosh', {dur: .4}], [.1, 'pop', {freq: 600}],
  ...[.75, 1.95, 3.3, 4.75].flatMap((a, i) => [[a, 'whoosh', {dur: .35, vol: .3}], [a + .42, 'clunk', {vol: .6 + i * .08}]]),
  [3.8, 'buzz', {dur: 1.0, vol: .12}], [5.2, 'buzz', {dur: 1.2, vol: .18}],
]};
</script></body></html>
