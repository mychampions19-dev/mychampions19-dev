<!doctype html>
<html><head><meta charset="utf-8"><title>S07-B06 Survival Over Fat Loss</title>
<link rel="stylesheet" href="../theme.css">
<style>
  #title { left:50%; top:110px; font-size:90px; }
  .row { position:absolute; left:960px; width:1000px; margin-left:-500px; height:190px; border-radius:50px; display:flex; align-items:center; gap:30px; padding:0 50px;
    box-shadow: inset 0 6px 0 rgba(255,255,255,.3), 0 24px 50px rgba(0,0,0,.45); font:700 80px 'Fredoka'; white-space:nowrap; }
  .row .n { font-size:70px; opacity:.7; width:80px; }
  .row .ok { margin-left:auto; font-size:100px; }
</style></head>
<body><div id="stage">
  <div id="cells" class="layer"></div>
  <div id="title" class="abs h3d">YOUR BODY'S PRIORITY</div>
  <div class="row" id="r1" style="top:360px;background:linear-gradient(135deg,#ff3b5c,#9b1030)"><span class="n">1</span><span class="emoji">🚨</span> SURVIVAL<span class="ok emoji">✅</span></div>
  <div class="row" id="r2" style="top:620px;background:linear-gradient(135deg,#6a6190,#2b2168)"><span class="n">2</span><span class="emoji">🔥</span> FAT LOSS<span class="ok emoji">❌</span></div>
</div>
<script src="../lib.js"></script>
<script>
const cells = makeCells(14, [['#ff6b6b','#b3122e'], ['#9b5cff','#3d1c8f']], 351, $('#cells'));
function render(t) {
  entryPunch(t); cells.update(t);
  css($('#title'), { transform: `translate(-50%,0) scale(${pop(t, .05, .4)})`, opacity: t > .05 ? 1 : 0 });
  const a = prog(t, .55, .22), b = pop(t, 1.25, .4), drop = ease.in(prog(t, 1.7, .5));
  css($('#r1'), { transform: `scale(${t < .55 ? 0 : lerp(1.8, 1, ease.back(a))})`, opacity: t > .55 ? 1 : 0 });
  css($('#r2'), { transform: `scale(${b}) translateY(${drop * 60}px) rotate(${drop * 4}deg)`, opacity: (t > 1.25 ? 1 : 0) * lerp(1, .55, drop) });
}
window.CLIP = { duration: 2.8, render, sfx: [
  [0, 'whoosh', {dur: .4}], [.05, 'pop', {freq: 500}], [.55, 'impact', {vol: .6}], [1.25, 'pop', {freq: 400}], [1.3, 'buzz', {dur: .3, vol: .25}], [1.7, 'whoosh', {dur: .5, rise: false, vol: .3}],
]};
</script></body></html>
