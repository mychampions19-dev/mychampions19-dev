<!doctype html>
<html><head><meta charset="utf-8"><title>S04-B07 No Signal</title>
<link rel="stylesheet" href="../theme.css">
<style>
  #sun { left:300px; top:270px; font-size:200px; }
  #roof { position:absolute; left:120px; right:120px; top:470px; height:70px; border-radius:20px;
    background:linear-gradient(#8b8fa8,#4a4d66); box-shadow:0 20px 40px rgba(0,0,0,.5); }
  #tube { position:absolute; left:760px; top:560px; width:400px; height:40px; border-radius:20px; background:#e8f0ff; }
  #tubeGlow { position:absolute; left:560px; top:540px; width:800px; height:300px; background:radial-gradient(ellipse at 50% 0%, rgba(210,230,255,.35), rgba(210,230,255,0) 70%); }
  #brain { left:960px; top:830px; font-size:190px; }
  #nosig { left:1450px; top:830px; white-space:nowrap; }
  #begun { left:1450px; top:270px; white-space:nowrap; }
  .wave { position:absolute; border:10px solid #ffd166; border-radius:50%; border-left-color:transparent; border-right-color:transparent; border-top-color:transparent; }
</style></head>
<body><div id="stage">
  <div id="cells" class="layer"></div>
  <div id="waves" class="layer" style="clip-path: inset(0 0 610px 0)"></div>
  <div id="sun" class="abs emoji">☀️</div>
  <div id="roof"></div><div id="tubeGlow"></div><div id="tube"></div>
  <div id="brain" class="abs emoji">🧠</div>
  <div id="nosig" class="abs"><span class="pill" style="font-size:54px;background:linear-gradient(135deg,#5a5d78,#2e3048)"><span class="emoji">📵</span> NO SIGNAL</span></div>
  <div id="begun" class="abs"><span class="pill" style="font-size:54px;background:linear-gradient(135deg,#ffd166,#ff9f43);color:#3a2300">DAY HAS BEGUN…?</span></div>
</div>
<script src="../lib.js"></script>
<script>
const cells = makeCells(16, [['#7fa0ff','#2a3fa8'], ['#9b5cff','#3d1c8f']], 181, $('#cells'));
const waves = Array.from({length: 6}, (_, i) => el('div','wave',$('#waves')));
function render(t) {
  entryPunch(t); cells.update(t);
  css($('#sun'), { transform: `translate(-50%,-50%) scale(${pop(t, .05, .5)}) rotate(${t * 20}deg)` });
  // signal waves travel down from the sun and die on the roof
  waves.forEach((w, i) => { const k = ((t * .9 + i / waves.length) % 1);
    const r = 60 + k * 260; css(w, { left: (300 - r) + 'px', top: (270 - r) + 'px', width: r * 2 + 'px', height: r * 2 + 'px', opacity: (1 - k) * .9 }); });
  $('#roof').style.transform = `scaleX(${ease.out(prog(t, .1, .4))})`;
  const flick = (Math.sin(t * 37) > .2 || Math.sin(t * 13) > .6) ? 1 : .35;
  $('#tube').style.opacity = flick * (t > .3 ? 1 : 0); $('#tubeGlow').style.opacity = flick * (t > .3 ? 1 : 0);
  css($('#brain'), { transform: `translate(-50%,-50%) scale(${pop(t, .2, .5)}) rotate(${Math.sin(t * 2) * 5}deg)`, filter: 'grayscale(.5) brightness(.8)' });
  css($('#nosig'), { transform: `translate(-50%,-50%) scale(${pop(t, .55, .4)})`, opacity: t > .55 ? 1 : 0 });
  css($('#begun'), { transform: `translate(-50%,-50%) scale(${pop(t, 1.75, .4)})`, opacity: t > 1.75 ? 1 : 0 });
}
window.CLIP = { duration: 3.9, render, sfx: [
  [0, 'whoosh', {dur: .4}], [.1, 'clunk', {vol: .5}], ...[.3, .5, .9, 1.3, 2.0, 2.6].map(a => [a, 'buzz', {dur: .12, vol: .12}]),
  [.55, 'buzz', {dur: .35, vol: .25}], [1.75, 'pop', {freq: 520}],
]};
</script></body></html>
