<!doctype html>
<html><head><meta charset="utf-8"><title>S07-B04 Adrenal Flood</title>
<link rel="stylesheet" href="../theme.css">
<style>
  .kid { position:absolute; top:560px; width:260px; height:380px; margin:-190px 0 0 -130px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:radial-gradient(circle at 35% 30%, #d9607a, #8a1d3a 75%);
    box-shadow: inset -20px -20px 40px rgba(0,0,0,.3), 0 30px 60px rgba(0,0,0,.5); }
  .kid::after { content:''; position:absolute; left:50%; top:45%; width:60px; height:110px; margin:-55px 0 0 -30px; border-radius:30px; background:#140a33; opacity:.55; }
  .adr { position:absolute; left:50%; top:-70px; width:170px; height:120px; margin-left:-85px; clip-path: polygon(50% 0, 100% 100%, 0 100%); background:linear-gradient(#ffe08a,#ffb13b); filter: drop-shadow(0 0 20px #ffd166); }
  #lbl { left:960px; top:120px; font-size:90px; }
  #chron { left:960px; top:960px; white-space:nowrap; }
  .drop { position:absolute; width:34px; height:34px; margin:-17px; border-radius:50% 50% 50% 0; transform: rotate(-45deg); background:radial-gradient(circle at 35% 35%, #ffb3c0, #ff3b5c 60%); box-shadow:0 0 14px #ff3b5c; }
  #flood { position:absolute; left:0; right:0; bottom:0; height:0; background:linear-gradient(rgba(255,59,92,.55), rgba(160,10,40,.85)); }
</style></head>
<body><div id="stage">
  <div id="cells" class="layer"></div>
  <div class="kid" id="k1" style="left:720px"><div class="adr"></div></div>
  <div class="kid" id="k2" style="left:1200px"><div class="adr"></div></div>
  <div id="drops" class="layer"></div>
  <div id="flood"></div>
  <div id="lbl" class="abs h3d">ADRENAL GLANDS</div>
  <div id="chron" class="abs"><span class="pill" style="font-size:64px;background:linear-gradient(135deg,#ff3b5c,#9b1030)"><span class="emoji">🌊</span> CHRONIC CORTISOL</span></div>
</div>
<script src="../lib.js"></script>
<script>
const cells = makeCells(14, [['#ff6b6b','#b3122e'], ['#ffd166','#c2551f']], 341, $('#cells'));
const r = rand(3), drops = Array.from({length: 46}, (_, i) => ({ d: el('div','drop',$('#drops')), sx: i % 2 ? 1200 : 720, a: r() * 6.28, sp: 300 + r() * 700, at: .7 + r() * 1.6 }));
function render(t) {
  entryPunch(t); cells.update(t);
  const k = pop(t, .05, .45);
  ['#k1', '#k2'].forEach((s, i) => $(s).style.transform = `scale(${k}) rotate(${(i ? 12 : -12) + Math.sin(t * 20) * (t > .7 ? 2 : 0)}deg)`);
  $$('.adr').forEach(a => a.style.transform = `scale(${1 + (t > .7 ? Math.sin(t * 18) * .08 : 0)})`);
  css($('#lbl'), { transform: `translate(-50%,-50%) scale(${pop(t, .2, .4)})`, opacity: t > .2 ? 1 : 0 });
  for (const q of drops) { const e = t - q.at; const on = e > 0;
    css(q.d, { left: (q.sx + Math.cos(q.a) * q.sp * Math.max(0, e)) + 'px', top: (380 + Math.sin(q.a) * q.sp * .6 * Math.max(0, e) + 200 * e * e) + 'px', opacity: on && e < 1.8 ? 1 : 0 }); }
  $('#flood').style.height = (ease.inOut(prog(t, 1.0, 2.0)) * 55) + '%';
  css($('#chron'), { transform: `translate(-50%,-50%) scale(${pop(t, 1.3, .45)})`, opacity: t > 1.3 ? 1 : 0 });
}
window.CLIP = { duration: 3.2, render, sfx: [
  [0, 'whoosh', {dur: .4}], [.2, 'pop', {freq: 500}], [.7, 'whoosh', {dur: 1.8, vol: .45}], [.75, 'buzz', {dur: 1.5, vol: .15}], [1.3, 'impact', {vol: .5}],
]};
</script></body></html>
