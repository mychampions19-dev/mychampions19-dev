<!doctype html>
<html><head><meta charset="utf-8"><title>S01-B04 Zero Calories</title>
<link rel="stylesheet" href="../theme.css">
<style>
  #wild { left:50%; top:50%; font-size:150px; }
  #zeroGrp { left:960px; top:520px; width:0; height:0; }
  #plate { position:absolute; left:-330px; top:-330px; width:660px; height:660px; border-radius:50%;
    background: radial-gradient(circle, #ffffff 0 52%, #e9e4ff 53% 60%, #ffffff 61% 66%, #d8d0fb 67% 100%);
    box-shadow: inset 0 -20px 40px rgba(60,30,140,.25), 0 40px 80px rgba(0,0,0,.5); }
  #num { position:absolute; left:0; top:-40px; transform: translate(-50%,-50%); font-size: 300px; color:#2ee6a8; font-weight:700;
    text-shadow: 0 3px 0 #1fc48f, 0 6px 0 #17a879, 0 9px 0 #108b63, 0 12px 0 #0a6e4e, 0 20px 30px rgba(0,0,0,.35); }
  #cal { position:absolute; left:0; top:130px; transform: translate(-50%,-50%); font-size: 64px; color:#3a2a7a; font-weight:700; letter-spacing:6px; }
  .fork { position:absolute; top:-120px; font-size:200px; }
  .food { position:absolute; top:640px; width:340px; height:340px; margin-left:-170px; margin-top:-170px; }
  .food .bub { position:absolute; inset:0; --c1:#fff5d6; --c2:#ffb13b; }
  .food .emoji { position:absolute; left:50%; top:50%; transform:translate(-50%,-52%); font-size:190px; }
  .food .ban { position:absolute; inset:-14px; border-radius:50%; border: 26px solid var(--warn); }
  .food .ban::after { content:''; position:absolute; left:50%; top:-10px; bottom:-10px; width:26px; margin-left:-13px; background: var(--warn); transform: rotate(45deg); }
  .food .lbl { position:absolute; left:50%; top:370px; transform:translateX(-50%); font-size:58px; }
</style></head>
<body><div id="stage">
  <div id="cells" class="layer"></div>
  <div id="wild" class="abs h3d burn">THE WILDEST PART?</div>
  <div id="zeroGrp" class="abs">
    <div id="plate"></div>
    <div class="fork emoji" style="left:-560px">🍴</div>
    <div id="num">0</div><div id="cal">CALORIES</div>
  </div>
  <div id="foods" class="layer"></div>
</div>
<script src="../lib.js"></script>
<script>
const cells = makeCells(24, [['#ffb13b','#c2551f'], ['#ff6b8a','#a3173f'], ['#9b5cff','#3d1c8f']], 11, $('#cells'));
$('.fork').style.display = 'none';
const FOODS = [
  { e: '🍩', l: 'DONUTS',    x: 480,  at: 3.75, c: ['#ffe0ef','#ff6b9d'] },
  { e: '🍔', l: 'JUNK FOOD', x: 960,  at: 4.55, c: ['#fff1cc','#ffb13b'] },
  { e: '🍰', l: 'CHEAT DAY', x: 1440, at: 5.35, c: ['#e6f0ff','#7fa0ff'] },
];
const foods = FOODS.map(f => {
  const d = el('div', 'food', $('#foods'));
  d.innerHTML = `<div class="bub glossy" style="--c1:${f.c[0]};--c2:${f.c[1]}"></div><div class="emoji">${f.e}</div><div class="ban"></div><div class="lbl h3d">${f.l}</div>`;
  d.style.left = f.x + 'px';
  return { ...f, d, ban: d.querySelector('.ban') };
});

function render(t) {
  entryPunch(t);
  cells.update(t);

  // "And the wildest part?"
  const wp = pop(t, .15, .5), wout = ease.in(prog(t, 1.35, .3));
  const wob = Math.sin(t * 9) * 3 * (1 - prog(t, .2, 1.2));
  css($('#wild'), { transform: `translate(-50%,-50%) scale(${wp * (1 + wout * .6)}) rotate(${wob}deg)`, opacity: 1 - wout });

  // Counter: 850 kcal → 0 slams on "single calorie"
  const zp = pop(t, 1.45, .45);
  const cd = ease.out(prog(t, 1.6, 1.25));
  const n = Math.round(lerp(850, 0, cd));
  $('#num').textContent = n;
  const slam = prog(t, 2.85, .2);
  const numScale = t < 2.85 ? .75 : lerp(1.9, 1, ease.back(slam));
  $('#num').style.transform = `translate(-50%,-50%) scale(${numScale})`;
  $('#num').style.color = '#2ee6a8';
  // move plate up & shrink when foods arrive
  const up = ease.inOut(prog(t, 3.35, .45));
  const shake = t > 2.85 && t < 3.2 ? Math.sin(t * 110) * 12 * (1 - prog(t, 2.85, .35)) : 0;
  css($('#zeroGrp'), { transform: `translate(${shake}px, ${lerp(0, -300, up)}px) scale(${zp * lerp(1, .42, up)})`, opacity: t > 1.45 ? 1 : 0 });

  // Food bubbles + ban stamps
  for (const f of foods) {
    const p = pop(t, f.at, .45);
    const b = ease.back(prog(t, f.at + .3, .25));
    css(f.d, { transform: `translateY(${lerp(80,0,p)}px) scale(${p})`, opacity: t > f.at ? 1 : 0 });
    css(f.ban, { transform: `scale(${lerp(2.2, 1, b)})`, opacity: t > f.at + .3 ? 1 : 0 });
    f.d.querySelector('.emoji').style.filter = t > f.at + .3 ? 'saturate(.55) brightness(.8)' : 'none';
  }
}

window.CLIP = {
  duration: 7.0,
  render,
  sfx: [
    [0.0, 'whoosh', {dur: .45}], [0.15, 'pop', {freq: 480, vol: .5}],
    [1.35, 'whoosh', {dur: .4, rise: false, vol: .35}],
    ...Array.from({length: 11}, (_, i) => [1.6 + Math.pow(i / 11, .6) * 1.2, 'tick', {vol: .3}]),
    [2.85, 'impact', {vol: .85}], [2.9, 'ding', {freq: 1047, dur: 1.0, vol: .25}],
    [3.35, 'whoosh', {dur: .45, vol: .3}],
    ...[3.75, 4.55, 5.35].flatMap(a => [[a, 'pop', {freq: 700}], [a + .3, 'buzz', {vol: .28}]]),
  ],
};
</script></body></html>
