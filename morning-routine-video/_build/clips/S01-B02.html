<!doctype html>
<html><head><meta charset="utf-8"><title>S01-B02 9AM Switch</title>
<link rel="stylesheet" href="../theme.css">
<style>
  #sunrise { position:absolute; left:-10%; right:-10%; bottom:-40%; height:90%;
    background: radial-gradient(ellipse at 50% 100%, rgba(255,177,59,.85), rgba(255,90,54,.45) 35%, rgba(255,90,54,0) 70%); }
  #headline { top: 90px; left: 50%; font-size: 130px; }
  #headline .amber { color: #ffd166; }
  #clockWrap { left: 960px; top: 560px; width: 0; height: 0; }
  .bell { position:absolute; width:150px; height:150px; --c1:#ff8a6b; --c2:#d9362b; }
  .clock { position:absolute; left:-230px; top:-230px; width:460px; height:460px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff9a7a, #e8432f 55%, #9e1f1f 100%);
    box-shadow: inset -16px -22px 40px rgba(0,0,0,.35), inset 10px 14px 20px rgba(255,255,255,.35), 0 30px 60px rgba(0,0,0,.5); }
  .face { position:absolute; inset:38px; border-radius:50%;
    background: radial-gradient(circle at 40% 35%, #ffffff, #f1ecff 60%, #d6cdfa 100%);
    box-shadow: inset 0 10px 24px rgba(40,20,100,.35); }
  .tick { position:absolute; left:50%; top:50%; width:10px; height:34px; margin:-17px -5px; border-radius:6px; background:#3a2a7a; }
  .hand { position:absolute; left:50%; bottom:50%; transform-origin: 50% 100%; border-radius: 12px; }
  #hourH { width:22px; height:110px; margin-left:-11px; background:#2b1d63; }
  #minH  { width:14px; height:160px; margin-left:-7px; background:#ff5a36; }
  .hub { position:absolute; left:50%; top:50%; width:36px; height:36px; margin:-18px; border-radius:50%; background:#2b1d63; box-shadow: 0 0 0 6px #ffd166; }
  .leg { position:absolute; width:40px; height:90px; background:#9e1f1f; border-radius:20px; top:170px; }
  #digital { left: 960px; top: 850px; transform: translate(-50%, 0); font-size: 64px; font-weight:700;
    padding: 10px 36px; border-radius: 22px; background: rgba(10,5,40,.75); border: 3px solid rgba(255,255,255,.2); letter-spacing: 4px; font-family:'Nunito'; }
  .person { position:absolute; width:46px; height:110px; }
  .person .ph { position:absolute; left:8px; top:0; width:30px; height:30px; border-radius:50%; }
  .person .pb { position:absolute; left:0; top:34px; width:46px; height:76px; border-radius:23px 23px 10px 10px; }
  #bodyWrap { left: 960px; top: 1080px; width: 600px; height: 900px; margin-left:-300px; transform-origin: 50% 0; }
  #bodyWrap svg { position:absolute; inset:0; overflow: visible; }
  #switch { position:absolute; left:190px; top:350px; transform: scale(1.35); width:220px; height:104px; border-radius:52px;
    background: #120a36; box-shadow: inset 0 6px 14px rgba(0,0,0,.7), 0 0 0 6px rgba(255,255,255,.25), 0 0 60px var(--glow, rgba(255,120,50,.8)); }
  #track { position:absolute; inset:8px; border-radius: 44px; }
  #knob { position:absolute; top:10px; width:84px; height:84px; --c1:#ffffff; --c2:#bdb6e8; }
  .swlabel { position:absolute; top:34px; font-size:30px; font-weight:700; letter-spacing:1px; }
  #modeTag { left: 960px; top: 170px; transform: translate(-50%,0); font-size: 64px; }
  #switchTitle { left:50%; top: 90px; font-size: 110px; }
  #flash { position:absolute; inset:0; background: radial-gradient(circle at 50% 55%, rgba(155,92,255,.9), rgba(61,107,255,0) 60%); opacity:0; }
</style></head>
<body><div id="stage">
  <div id="sunrise"></div>
  <div id="cells" class="layer"></div>
  <div id="crowd" class="layer"></div>

  <div id="clockWrap" class="abs">
    <div class="bell glossy" style="left:-250px; top:-300px"></div>
    <div class="bell glossy" style="left:100px; top:-300px"></div>
    <div class="leg" style="left:-170px; transform:rotate(30deg)"></div>
    <div class="leg" style="left:130px; transform:rotate(-30deg)"></div>
    <div class="clock"><div class="face" id="face">
      <div class="hand" id="hourH"></div><div class="hand" id="minH"></div><div class="hub"></div>
    </div></div>
  </div>
  <div id="digital" class="abs">6:00 AM</div>
  <div id="headline" class="abs h3d">BEFORE <span class="amber">9:00 AM</span></div>
  <div id="switchTitle" class="abs h3d">THE BIOLOGICAL SWITCH</div>

  <div id="flash"></div>
  <div id="bodyWrap" class="abs">
    <svg viewBox="0 0 600 900">
      <defs>
        <radialGradient id="bellyGlow" cx="50%" cy="45%" r="50%">
          <stop offset="0" id="bg0" stop-color="#ff7a3d" stop-opacity=".75"/><stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3a2a8a"/><stop offset="1" stop-color="#170d47"/>
        </linearGradient>
      </defs>
      <g id="outline" stroke="#ff7a3d" fill="#ff7a3d" stroke-linecap="round">
        <circle cx="300" cy="105" r="92"/>
        <rect x="160" y="195" width="280" height="370" rx="120"/>
        <line x1="185" y1="260" x2="90" y2="540" stroke-width="98"/><line x1="415" y1="260" x2="510" y2="540" stroke-width="98"/>
        <line x1="240" y1="520" x2="222" y2="850" stroke-width="112"/><line x1="360" y1="520" x2="378" y2="850" stroke-width="112"/>
      </g>
      <g fill="url(#glass)" stroke="url(#glass)" stroke-linecap="round">
        <circle cx="300" cy="105" r="80"/>
        <rect x="172" y="207" width="256" height="346" rx="110"/>
        <line x1="185" y1="260" x2="90" y2="540" stroke-width="74"/><line x1="415" y1="260" x2="510" y2="540" stroke-width="74"/>
        <line x1="240" y1="520" x2="222" y2="850" stroke-width="88"/><line x1="360" y1="520" x2="378" y2="850" stroke-width="88"/>
      </g>
      <ellipse cx="300" cy="400" rx="200" ry="200" fill="url(#bellyGlow)"/>
      <ellipse cx="250" cy="70" rx="30" ry="18" fill="rgba(255,255,255,.35)"/>
    </svg>
    <div id="switch"><div id="track"></div>
      <div class="swlabel" id="lblStore" style="left:22px; color:#bfd0ff">STORE</div>
      <div class="swlabel" id="lblBurn" style="right:26px; color:#ffe2b8">BURN</div>
      <div id="knob" class="glossy"></div>
    </div>
  </div>
  <div id="modeTag" class="abs"><span class="pill" style="background:linear-gradient(135deg,var(--store-1),var(--store-2))"><span class="emoji">🔒</span> FAT STORAGE MODE</span></div>
</div>
<script src="../lib.js"></script>
<script>
const cells = makeCells(26, [['#ff6b6b','#b3122e'], ['#9b5cff','#3d1c8f'], ['#ffb13b','#c2551f']], 3, $('#cells'));
// clock ticks
for (let i = 0; i < 12; i++) { const k = el('div','tick',$('#face')); k.style.transform = `rotate(${i*30}deg) translateY(-150px)`; }
// crowd ("millions of people")
const crowd = [], r = rand(9), pcols = ['#ffb13b','#ff6b8a','#2ee6a8','#7fa0ff','#c79bff','#ffd166'];
for (let i = 0; i < 34; i++) {
  const p = el('div','person',$('#crowd')); const c = pcols[i % pcols.length];
  p.innerHTML = `<div class="ph" style="background:${c}"></div><div class="pb" style="background:${c}"></div>`;
  const row = i % 2, x = 40 + (i / 34) * 1840 + r() * 20, s = row ? .8 : 1.05;
  crowd.push({ p, x, y: row ? 880 : 940, s, d: 1.1 + r() * 1.2 });
}

function render(t) {
  entryPunch(t);
  cells.update(t);
  const B = ease.inOut(prog(t, 2.55, .6));           // phase A → B transition

  // Headline
  const hp = pop(t, .12, .5);
  css($('#headline'), { transform: `translate(-50%, ${lerp(-40, 0, hp) - B*260}px) scale(${hp})`, opacity: 1 - B });

  // Clock: spins 6:00 → 9:00 then rings, then flies to corner
  const cp = pop(t, .05, .55);
  const spin = ease.inOut(prog(t, .45, 1.95));
  const mins = 360 + spin * 180;                      // minutes past midnight: 6:00 → 9:00
  $('#minH').style.transform = `rotate(${(mins % 60) * 6}deg)`;
  $('#hourH').style.transform = `rotate(${(mins / 60) * 30}deg)`;
  const ring = t > 2.4 && t < 3.1 ? Math.sin(t * 90) * 7 * (1 - prog(t, 2.4, .7)) : 0;
  const cx = lerp(960, 330, B), cy = lerp(560, 600, B), cs = lerp(1, .5, B);
  $('#clockWrap').style.transform = `translate(${cx-960}px, ${cy-560}px) scale(${cp * cs}) rotate(${ring}deg)`;
  const hh = Math.floor(mins / 60), mm = Math.floor(mins % 60);
  $('#digital').textContent = `${hh}:${String(mm).padStart(2,'0')} AM`;
  css($('#digital'), { opacity: pop(t,.3,.4) * (1 - B), transform: `translate(-50%, ${B*120}px)`,
    color: spin >= 1 ? '#ffd166' : '#fff' });
  $('#sunrise').style.opacity = (.15 + spin * .85) * (1 - B * .6);

  // Crowd pops in on "millions of people"
  for (const c of crowd) {
    const p = pop(t, c.d, .35);
    c.p.style.transform = `translate(${c.x}px, ${c.y + (1-p)*140 + B*260}px) scale(${c.s * p})`;
    c.p.style.opacity = (p > 0 ? .9 : 0) * (1 - B);
  }

  // Phase B: glass body rises with the switch in the belly
  const bp = ease.back(prog(t, 2.7, .7));
  $('#bodyWrap').style.transform = `translateY(${lerp(0, -900, bp)}px) scale(.9)`;
  const tp = pop(t, 3.0, .5);
  css($('#switchTitle'), { transform: `translate(-50%,0) scale(${tp})`, opacity: t > 3 ? 1 : 0 });

  // Flip at 3.9s (on "switch")
  const f = ease.out(prog(t, 3.9, .16));
  const knobX = lerp(10, 126, f);
  $('#knob').style.left = knobX + 'px';
  $('#track').style.background = f < .5
    ? 'linear-gradient(90deg, rgba(255,90,54,.0), rgba(255,177,59,.55))'
    : 'linear-gradient(90deg, rgba(61,107,255,.55), rgba(155,92,255,.0))';
  $('#lblBurn').style.opacity = f < .5 ? .95 : 0;  $('#lblStore').style.opacity = f < .5 ? 0 : .95;
  // colour swap burn → store
  const col = f < .5 ? '#ff7a3d' : '#7a6bff';
  $('#outline').setAttribute('stroke', col); $('#outline').setAttribute('fill', col);
  $('#bg0').setAttribute('stop-color', f < .5 ? '#ff7a3d' : '#5b6bff');
  $('#switch').style.setProperty('--glow', f < .5 ? 'rgba(255,120,50,.8)' : 'rgba(110,100,255,.9)');
  const shake = t > 3.9 && t < 4.3 ? Math.sin(t * 120) * 10 * (1 - prog(t, 3.9, .4)) : 0;
  $('#stage').style.transform += ` translateX(${shake}px)`;
  $('#flash').style.opacity = t > 3.9 ? Math.max(0, 1 - (t - 3.9) / .6) : 0;

  // Mode tag
  const mp = pop(t, 4.25, .45);
  css($('#modeTag'), { transform: `translate(-50%, ${lerp(30,0,mp)}px) scale(${mp})`, opacity: t > 4.25 ? 1 : 0, top: '860px' });
  // title moves up out of the way when tag arrives? keep both: title top, tag bottom
}

window.CLIP = {
  duration: 6.0,
  render,
  sfx: [
    [0.00, 'whoosh', {dur: .5}], [0.12, 'pop', {freq: 520}],
    ...Array.from({length: 20}, (_, i) => [0.45 + i * .1, 'tick', {vol: .28}]),
    [2.40, 'ding', {freq: 1568, dur: 1.0, vol: .3}], [2.46, 'ding', {freq: 1760, dur: .9, vol: .2}],
    ...[1.2, 1.5, 1.8, 2.1].map(x => [x, 'pop', {freq: 900 + x * 200, vol: .15}]),
    [2.55, 'whoosh', {dur: .6, rise: false}], [3.0, 'pop', {freq: 600}],
    [2.95, 'riser', {dur: .95, vol: .2}], [3.9, 'clunk', {vol: .85}], [3.9, 'impact', {vol: .5}],
    [4.0, 'freeze', {dur: 1.4}], [4.25, 'pop', {freq: 440}],
  ],
};
</script></body></html>
