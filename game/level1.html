<title>Hero Escape Prototype</title>
<style>
/* Layout: one fixed 540x960 portrait stage, letterboxed, everything drawn on canvas */
:root{
  --bg:#1c0f0b;
  --fg:#fff4e6;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
</style>
<canvas id="c" aria-label="Hero Escape game"></canvas>
<script src="hero-art.js"></script>
<script>
'use strict';
/* =====================================================================
   HERO ESCAPE — Level 1 greybox prototype
   Phase 1: Snake chase   (clear columns so the hero can run to the exit)
   Phase 2: Stone flood   (open a channel so the stones drain past the slab)
   Phase 3: Underwater    (carve a path up to the exit before air runs out)
   ===================================================================== */
const VW = 540, VH = 960;
const CFG = { relaxed: false, sound: true };
const TIMES = { rat: 50, hold: 50, air: 50 };   // seconds, Normal mode
const mult = () => (CFG.relaxed ? 1.5 : 1);

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let dpr = 1, scale = 1, offX = 0, offY = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  scale = Math.min(w / VW, h / VH);
  offX = (w - VW * scale) / 2; offY = (h - VH * scale) / 2;
}
window.addEventListener('resize', resize); resize();
const view = () => ({ top: -offY / scale, bottom: VH + offY / scale, left: -offX / scale, right: VW + offX / scale });

// ---------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function star(g, x, y, R, fill) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * .45 : R; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  g.closePath(); g.fillStyle = fill; g.fill();
}

class Path {
  constructor(pts) {
    this.pts = pts; this.cum = [0];
    for (let i = 1; i < pts.length; i++) this.cum.push(this.cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    this.len = this.cum[this.cum.length - 1];
  }
  at(s) {
    const p = this.pts, n = p.length;
    let i;
    if (s <= 0) i = 1; else if (s >= this.len) i = n - 1;
    else { i = 1; while (this.cum[i] < s) i++; }
    const a = p[i - 1], b = p[i], L = this.cum[i] - this.cum[i - 1] || 1, k = (s - this.cum[i - 1]) / L;
    return { x: a[0] + (b[0] - a[0]) * k, y: a[1] + (b[1] - a[1]) * k, a: Math.atan2(b[1] - a[1], b[0] - a[0]) };
  }
}

// ---------- audio (WebAudio synth, no files)
let AC = null;
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'sine', vol = .12, slide = 0, delay = 0) {
  if (!AC || !CFG.sound) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .05);
}
const SFX = {
  tick: n => tone(420 * Math.pow(1.09, n), .07, 'triangle', .07),
  pop: n => { for (let i = 0; i < Math.min(n, 7); i++) tone(520 * Math.pow(1.12, i), .12, 'sine', .1, 1.6, i * .035); },
  thud: () => tone(140, .12, 'triangle', .08, .6),
  lose: () => { tone(330, .3, 'sawtooth', .07, .7); tone(220, .5, 'sawtooth', .07, .5, .25); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', .1, 1, i * .11)),
  splash: () => tone(900, .4, 'sine', .06, .2),
  blast: t => t === 'bomb' ? tone(90, .35, 'sawtooth', .1, .5)
    : t === 'rainbow' ? [0, 1, 2, 3, 4].forEach(i => tone(600 + i * 150, .12, 'triangle', .07, 1, i * .04))
    : tone(300, .3, 'sawtooth', .06, 3),
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ---------- block art (cached sprites). Blocks are sweets: giant to a tiny hero.
const COLORS = {
  red:    { base: '#e8262b', light: '#ff8a7a', dark: '#8f0d12' },
  yellow: { base: '#ffbf1a', light: '#fff09a', dark: '#b86c00' },
  blue:   { base: '#2068ff', light: '#8fbaff', dark: '#0b36a0' },
  green:  { base: '#2fcf3a', light: '#a8f79a', dark: '#117a19' },
  rainbow:{ base: '#6b3f22', light: '#b07a4e', dark: '#2e180b' },
};
const SPRINKLES = ['#ff4d6d', '#ffd23a', '#3fa7ff', '#4fd65a', '#ffffff', '#c86bff'];
const SPR = {};
function shapePath(g, color, s) {
  const cx = s / 2, cy = s / 2;
  g.beginPath();
  if (color === 'red' || color === 'rainbow') g.arc(cx, cy + s * .03, s * .39, 0, Math.PI * 2);
  else if (color === 'blue') rr(g, s * .12, s * .12, s * .76, s * .76, s * .18);
  else if (color === 'yellow') {
    for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; g.lineTo(cx + Math.cos(a) * s * .43, cy + Math.sin(a) * s * .43); }
    g.closePath();
  } else {
    g.moveTo(cx - s * .12, cy - s * .38); g.lineTo(cx + s * .12, cy - s * .38);
    g.quadraticCurveTo(cx + s * .16, cy - s * .18, cx + s * .3, cy - s * .06);
    g.quadraticCurveTo(cx + s * .44, cy + s * .1, cx + s * .38, cy + s * .3);
    g.quadraticCurveTo(cx, cy + s * .44, cx - s * .38, cy + s * .3);
    g.quadraticCurveTo(cx - s * .44, cy + s * .1, cx - s * .3, cy - s * .06);
    g.quadraticCurveTo(cx - s * .16, cy - s * .18, cx - s * .12, cy - s * .38); g.closePath();
  }
}
function blockSprite(color, s, special) {
  const key = color + s + (special || ''); if (SPR[key]) return SPR[key];
  const k = 3, c = document.createElement('canvas'); c.width = c.height = s * k;
  const g = c.getContext('2d'); g.scale(k, k);
  const C = COLORS[color], cx = s / 2, cy = s / 2;
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(cx, cy + s * .37, s * .33, s * .07, 0, 0, 7); g.fill();
  if (special === 'bomb') { // glowing wrapper
    g.fillStyle = 'rgba(255,240,150,.55)'; g.beginPath(); g.arc(cx, cy, s * .5, 0, 7); g.fill();
  }
  shapePath(g, color, s);
  const grd = g.createRadialGradient(cx - s * .12, cy - s * .15, s * .04, cx, cy, s * .5);
  grd.addColorStop(0, C.light); grd.addColorStop(.5, C.base); grd.addColorStop(1, C.dark);
  g.fillStyle = grd; g.fill(); g.lineWidth = s * .04; g.strokeStyle = C.dark; g.stroke();
  if (color === 'rainbow') { // chocolate ball with sprinkles
    for (let i = 0; i < 16; i++) {
      const a = i * 2.39996, r = s * .3 * Math.sqrt((i + .5) / 16);
      g.save(); g.translate(cx + Math.cos(a) * r, cy + s * .03 + Math.sin(a) * r); g.rotate(a * 3);
      g.fillStyle = SPRINKLES[i % SPRINKLES.length]; rr(g, -s * .045, -s * .015, s * .09, s * .03, s * .015); g.fill(); g.restore();
    }
  }
  g.save(); shapePath(g, color, s); g.clip();
  if (special === 'h' || special === 'v') { // stripes = rocket
    g.translate(cx, cy); if (special === 'v') g.rotate(Math.PI / 2);
    g.fillStyle = 'rgba(255,255,255,.92)';
    g.fillRect(-s * .5, -s * .14, s, s * .08); g.fillRect(-s * .5, s * .06, s, s * .08);
  }
  g.restore();
  g.fillStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.ellipse(cx - s * .1, cy - s * .17, s * .13, s * .065, -.5, 0, 7); g.fill();
  if (color === 'red') {
    g.strokeStyle = '#5a3a12'; g.lineWidth = s * .05; g.beginPath(); g.moveTo(cx, cy - s * .3); g.lineTo(cx + s * .03, cy - s * .43); g.stroke();
    g.fillStyle = '#3fbf3a'; g.beginPath(); g.ellipse(cx + s * .12, cy - s * .4, s * .09, s * .045, -.4, 0, 7); g.fill();
  }
  if (special === 'h' || special === 'v') { // arrow tips
    g.save(); g.translate(cx, cy); if (special === 'v') g.rotate(Math.PI / 2);
    g.fillStyle = '#fff'; g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1;
    for (const d of [-1, 1]) { g.beginPath(); g.moveTo(d * s * .5, 0); g.lineTo(d * s * .36, -s * .1); g.lineTo(d * s * .36, s * .1); g.closePath(); g.fill(); g.stroke(); }
    g.restore();
  }
  if (special === 'bomb') star(g, cx, cy, s * .15, '#fffbe0');
  return (SPR[key] = c);
}
function beanSprite(R) {
  const key = 'bean' + R; if (SPR[key]) return SPR[key];
  const k = 3, c = document.createElement('canvas'); c.width = c.height = R * 2 * k;
  const g = c.getContext('2d'); g.scale(k, k);
  const grd = g.createRadialGradient(R * .75, R * .7, R * .1, R, R, R * 1.1);
  grd.addColorStop(0, '#a8693a'); grd.addColorStop(.6, '#6e3d1c'); grd.addColorStop(1, '#3a1d0b');
  g.fillStyle = grd; g.beginPath(); g.ellipse(R, R, R * .98, R * .74, 0, 0, 7); g.fill();
  g.strokeStyle = '#2a1206'; g.lineWidth = 1.4; g.beginPath();
  g.moveTo(R * .2, R); g.bezierCurveTo(R * .7, R * .7, R * 1.3, R * 1.3, R * 1.8, R); g.stroke();
  return (SPR[key] = c);
}

// ---------- real-world backdrops: painted small, then scaled up so they read as out-of-focus photography
function blurBG(draw, f = 7) {
  const sw = Math.ceil(VW / f), sh = Math.ceil(VH / f);
  const sm = document.createElement('canvas'); sm.width = sw; sm.height = sh;
  const g = sm.getContext('2d'); g.scale(1 / f, 1 / f); draw(g);
  const md = document.createElement('canvas'); md.width = sw * 3; md.height = sh * 3;
  const m = md.getContext('2d'); m.imageSmoothingEnabled = true; m.imageSmoothingQuality = 'high'; m.drawImage(sm, 0, 0, md.width, md.height);
  const out = document.createElement('canvas'); out.width = VW; out.height = VH;
  const o = out.getContext('2d'); o.imageSmoothingEnabled = true; o.imageSmoothingQuality = 'high'; o.drawImage(md, 0, 0, VW, VH);
  return out;
}
function bokeh(o, n, colors, rMin, rMax, alpha = .22) {
  for (let i = 0; i < n; i++) {
    const x = rand(0, VW), y = rand(0, VH), r = rand(rMin, rMax);
    const grd = o.createRadialGradient(x, y, r * .2, x, y, r);
    const col = pick(colors);
    grd.addColorStop(0, col.replace('A', alpha * .6)); grd.addColorStop(.85, col.replace('A', alpha)); grd.addColorStop(1, col.replace('A', 0));
    o.fillStyle = grd; o.beginPath(); o.arc(x, y, r, 0, 7); o.fill();
  }
}
function softBlob(g, x, y, rx, ry, c0, c1) {
  const grd = g.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
  grd.addColorStop(0, c0); grd.addColorStop(1, c1);
  g.save(); g.translate(x, y); g.scale(rx / Math.max(rx, ry), ry / Math.max(rx, ry)); g.translate(-x, -y);
  g.fillStyle = grd; g.beginPath(); g.arc(x, y, Math.max(rx, ry), 0, 7); g.fill(); g.restore();
}
const BG = {};
function buildBackdrops() {
  // 1. Kitchen floor: warm wall, window glow, a giant table leg, a pot plant, skirting board
  BG.kitchen = blurBG(g => {
    const w = g.createLinearGradient(0, 0, 0, VH); w.addColorStop(0, '#f1dcbc'); w.addColorStop(.75, '#d2a87c'); w.addColorStop(1, '#a87750');
    g.fillStyle = w; g.fillRect(0, 0, VW, VH);
    softBlob(g, 470, 90, 300, 260, 'rgba(255,250,230,1)', 'rgba(255,250,230,0)');
    g.fillStyle = '#6b4127'; g.fillRect(360, 0, 90, 760);
    g.fillStyle = '#8a5735'; g.fillRect(372, 0, 22, 760);
    g.fillStyle = '#2f6b2c'; [[60, 160, 90], [130, 110, 70], [20, 260, 70], [150, 230, 60]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); });
    g.fillStyle = '#b5532f'; g.fillRect(40, 320, 140, 150);
    g.fillStyle = '#f4efe6'; g.fillRect(0, 760, VW, 130);
    g.fillStyle = '#7c4f30'; g.fillRect(0, 880, VW, 80);
  });
  bokeh(BG.kitchen.getContext('2d'), 14, ['rgba(255,245,210,A)', 'rgba(255,220,170,A)'], 18, 60);
  // 2. Pantry shelf: dark wood, blurred jars of pasta, lentils and rice
  BG.pantry = blurBG(g => {
    const w = g.createLinearGradient(0, 0, 0, VH); w.addColorStop(0, '#4a2e1d'); w.addColorStop(1, '#2a170d');
    g.fillStyle = w; g.fillRect(0, 0, VW, VH);
    softBlob(g, 120, 140, 220, 200, 'rgba(255,214,150,.65)', 'rgba(255,214,150,0)');
    const jar = (x, y, wd, ht, fill) => { g.fillStyle = 'rgba(220,235,245,.35)'; rr(g, x, y, wd, ht, 26); g.fill(); g.fillStyle = fill; rr(g, x + 8, y + ht * .35, wd - 16, ht * .62, 18); g.fill(); g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(x + 14, y + 20, 10, ht - 50); };
    jar(10, 40, 130, 300, '#e88a2c'); jar(170, 90, 110, 250, '#f2e6c8'); jar(310, 20, 150, 330, '#c2462e'); jar(470, 80, 90, 260, '#e8c25a');
    g.fillStyle = '#7a4c2c'; g.fillRect(0, 350, VW, 34); g.fillRect(0, 900, VW, 60);
    jar(30, 420, 120, 260, '#8b5a2b'); jar(400, 460, 140, 300, '#d9d2b8');
  });
  bokeh(BG.pantry.getContext('2d'), 10, ['rgba(255,210,140,A)'], 20, 55, .18);
  // 3. Kitchen sink: steel basin, a giant chrome tap, the plughole, all seen through water
  BG.sink = blurBG(g => {
    const w = g.createLinearGradient(0, 0, 0, VH); w.addColorStop(0, '#c7d3dd'); w.addColorStop(1, '#6d8091');
    g.fillStyle = w; g.fillRect(0, 0, VW, VH);
    softBlob(g, 380, 260, 260, 360, 'rgba(255,255,255,.7)', 'rgba(255,255,255,0)');
    g.fillStyle = '#9fb0bf'; rr(g, 60, -40, 120, 260, 50); g.fill();
    g.fillStyle = '#e8eef3'; rr(g, 80, -40, 30, 240, 15); g.fill();
    g.fillStyle = '#3e4c58'; g.beginPath(); g.ellipse(300, 900, 130, 50, 0, 0, 7); g.fill();
    g.fillStyle = '#1e262d'; g.beginPath(); g.ellipse(300, 900, 70, 26, 0, 0, 7); g.fill();
  });
  bokeh(BG.sink.getContext('2d'), 12, ['rgba(255,255,255,A)'], 10, 40, .2);

// ---------- particles
let parts = [];
function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 7), v = rand(80, 260);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0, max: rand(.35, .6), color, r: rand(3, 6), g: 600 });
  }
}
function splash(x, y) {
  for (let i = 0; i < 26; i++) parts.push({ x: x + rand(-14, 14), y, vx: rand(-140, 140), vy: rand(-420, -120), life: 0, max: rand(.5, .9), color: '#cdeeff', r: rand(2, 5), g: 900 });
  SFX.splash();
}
function updateParts(dt) {
  for (const p of parts) { p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life < p.max);
}
function drawParts(g) {
  for (const p of parts) {
    g.globalAlpha = 1 - p.life / p.max; g.fillStyle = p.color;
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}

// ---------- block grid
// Match-3 board. Swap two touching blocks; a swap only sticks if it lines up 3+ of one colour.
// Boards are finite (no refill) because each phase is about emptying space for the hero.
// Specials: 4 in a row makes a rocket (h clears its row, v its column), an L or T makes a bomb (3x3),
// 5 in a row makes a choc bomb (rainbow) that clears every block of the colour it is swapped with.
const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];
const key = q => q.r * 100 + q.c;
class Grid {
  constructor(o) {
    Object.assign(this, o);
    this.valid = []; this.cells = [];
    for (let r = 0; r < this.rows; r++) {
      this.valid.push([]); this.cells.push([]);
      for (let c = 0; c < this.cols; c++) { this.valid[r].push(!!this.mask(r, c)); this.cells[r].push(null); }
    }
    for (let tries = 0; tries < 60; tries++) { this.fill(); if (this.findMove()) break; }
    this.popping = []; this.fx = []; this.version = 0;
    this.state = 'idle'; this.anim = null; this.combo = 0; this.lastSwap = null;
  }
  // random colours, but never 3 in a row at the start
  fill() {
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      if (!this.valid[r][c]) continue;
      const bad = new Set(), L1 = this.get(r, c - 1), L2 = this.get(r, c - 2), U1 = this.get(r - 1, c), U2 = this.get(r - 2, c);
      if (L1 && L2 && L1.color === L2.color) bad.add(L1.color);
      if (U1 && U2 && U1.color === U2.color) bad.add(U1.color);
      const opts = this.colors.filter(k => !bad.has(k));
      this.cells[r][c] = { color: pick(opts.length ? opts : this.colors), special: null, oy: 0, vy: 0, sq: 0 };
    }
  }
  inside(r, c) { return r >= 0 && r < this.rows && c >= 0 && c < this.cols && this.valid[r][c]; }
  get(r, c) { return this.inside(r, c) ? this.cells[r][c] : null; }
  center(r, c) { return [this.x + (c + .5) * this.cell, this.y + (r + .5) * this.cell]; }
  cellAt(px, py) {
    const c = Math.floor((px - this.x) / this.cell), r = Math.floor((py - this.y) / this.cell);
    return this.inside(r, c) ? { r, c } : null;
  }
  // used by the underwater path search: 8-way so diagonal gaps count
  neighbors(r, c) {
    const out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++)
      if ((dr || dc) && this.inside(r + dr, c + dc)) out.push({ r: r + dr, c: c + dc });
    return out;
  }
  same(b, o) { return b && o && b.color === o.color && b.color !== 'rainbow'; }
  rawSwap(a, b) { const t = this.cells[a.r][a.c]; this.cells[a.r][a.c] = this.cells[b.r][b.c]; this.cells[b.r][b.c] = t; }
  runLen(r, c, dr, dc) {
    const b = this.get(r, c); let n = 0;
    for (let k = 1; ; k++) { if (!this.same(b, this.get(r + dr * k, c + dc * k))) return n; n++; }
  }
  matchAt(r, c) {
    const b = this.get(r, c); if (!b || b.color === 'rainbow') return false;
    return this.runLen(r, c, 0, -1) + this.runLen(r, c, 0, 1) >= 2 || this.runLen(r, c, -1, 0) + this.runLen(r, c, 1, 0) >= 2;
  }
  isRainbowSwap(a, b) {
    const A = this.get(a.r, a.c), B = this.get(b.r, b.c);
    return !!(A && B && (A.color === 'rainbow' || B.color === 'rainbow'));
  }
  canSwap(a, b) {
    if (!this.inside(b.r, b.c) || !this.get(a.r, a.c)) return false;
    if (!this.get(b.r, b.c) && this.gravity) return false; // sliding into a gap only works without gravity
    if (this.isRainbowSwap(a, b)) return true;
    this.rawSwap(a, b);

    this.rawSwap(a, b);

  }
  findMove(priority) {
    let best = null, bestScore = Infinity;
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {

}
function startPhase(i) {

function pathStep(pts, speed, opt = {}) {

    start() { P = new Path(pts); this.dur = P.len / speed; if (opt.pose) hero.pose = opt.pose; hero.inCart = !!opt.cart; },
    update(k, dt) {

function seq12() {

    doStep(() => { hero.pose = 'cheer'; caption('Phew! Hop in the toy cart!', 2.4); }),
    waitStep(.5),
    pathStep([[hero.x, 880], [600, 880]], 200, { pose: 'walk' }),
    doStep(() => (hero.visible = false)),
    camStep(960, 1.1),
    doStep(() => { hero.visible = true; hero.pose = 'idle'; }),
    pathStep(TRACK2, 420, { cart: true, pose: 'idle' }),

function seq23() {

    waitStep(.8),
    pathStep([[hero.x, hero.y], [55, hero.y]], 160, { pose: 'walk' }),
    pathStep([[55, 1840], [55, surf]], 560, { pose: 'fall', follow: [960, 1920, 380] }),
    doStep(() => { splash(55, surf); hero.scale = .8; }),
    pathStep([[55, surf], [62, rest]], 200, { pose: 'swim', follow: [1920, 1920, 0] }),

cv.addEventListener('pointerdown', e => {

    for (let s = 0; s < 3; s++) star(g, 360 + s * 34, y, 13, s < n ? '#ffd23a' : 'rgba(255,255,255,.18)');
  });
  const played = G.results.filter(Boolean).length;
  g.textAlign = 'center'; g.font = '700 17px system-ui,sans-serif'; g.fillStyle = '#e6dcf7';
  g.fillText(`${played} phase${played === 1 ? '' : 's'} · ${time.toFixed(1)}s · ${total}/${played * 3} stars`, 270, 600);
  button(g, 120, 640, 300, 72, '▶  PLAY AGAIN', () => startLevel(0), true);
  button(g, 120, 730, 300, 54, 'Main menu', () => (G.state = 'title'));
}

function render() {
  const T = G.time, v = view();
  buttons = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1c0f0b'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sk = G.shake > 0 ? (Math.random() - .5) * G.shake * 16 : 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sk * scale), dpr * offY);
  // world
  ctx.save(); ctx.translate(0, -G.camY);
  const wTop = G.camY + v.top, wBot = G.camY + v.bottom;
  drawBackground(ctx, wTop, wBot, T);
  for (const P of PHASES) {
    if (!P.grid || P.base > wBot || P.base + 980 < wTop) continue;
    ctx.save(); ctx.translate(0, P.base); P.draw(ctx, T); ctx.restore();
  }
  drawHero(ctx, T);
  for (const P of PHASES) {
    if (!P.drawOver || !P.grid || P.base > wBot || P.base + 980 < wTop) continue;
    ctx.save(); ctx.translate(0, P.base); P.drawOver(ctx, T); ctx.restore();
  }
  drawParts(ctx);
  // combo text
  if (G.combo && G.state === 'play') {
    const k = G.time - G.combo.start;
    if (k < 1) { ctx.globalAlpha = Math.min(1, (1 - k) * 3); textOutlined(ctx, G.combo.text, 270, PHASES[G.phase].base + PHASES[G.phase].captionY + 46 - k * 30, 34 + (1 - Math.min(1, k * 4)) * 14, '#fff'); ctx.globalAlpha = 1; }
    else G.combo = null;
  }
  // tutorial hand: shows a valid swipe
  if (G.state === 'play' && !drag && !G.hammerArmed && PHASES[G.phase].grid.state === 'idle' && G.phaseT - G.lastMove > (G.lastMove ? 6 : 1.2)) {
    const P = PHASES[G.phase], gr = P.grid;
    if (G.hintVersion !== gr.version) { G.hint = gr.findMove(P.hintPriority.bind(P)); G.hintVersion = gr.version; }
    if (G.hint) {
      const k = (T * .8) % 1, f = ease(clamp((k - .2) / .5, 0, 1));
      const a = gr.center(G.hint.a.r, G.hint.a.c), b = gr.center(G.hint.b.r, G.hint.b.c);
      ctx.globalAlpha = .9 * Math.min(1, (1 - k) * 5); drawHand(ctx, lerp(a[0], b[0], f), lerp(a[1], b[1], f) + P.base); ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
  // screen space
  if (G.state === 'play' || G.state === 'seq' || G.state === 'lose') { drawHUD(ctx, v); drawCaption(ctx); }
  if (G.state === 'title') drawTitle(ctx, v);
  if (G.state === 'lose') drawLose(ctx, v);
  if (G.state === 'win') drawWin(ctx, v);
}

function update(dt) {
  G.time += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (captionObj) { captionObj.t += dt; if (captionObj.t > captionObj.dur) captionObj = null; }
  if (G.state === 'play') {
    G.phaseT += dt;
    for (const t of timers) { t.t -= dt; if (t.t <= 0 && !t.done) { t.done = 1; if (t.epoch === G.epoch) t.fn(); } }
    timers = timers.filter(t => !t.done);
  }
  if (G.state === 'seq') updateSeq(dt);
  PHASES.forEach((P, i) => P.grid && P.update(dt, G.state === 'play' && G.phase === i));
  updateParts(dt);
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - lastT) / 1000); lastT = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
// title screen shows the level behind it
buildBackdrops();
PHASES.forEach(p => p.init()); P1.placeHero();
window.HeroEscape = { G, PHASES, hero, startLevel, phaseWon };
requestAnimationFrame(frame);
</script>
