<title>Hero Escape Prototype</title>
<style>
/* Layout: one fixed 540x960 portrait stage, letterboxed, everything drawn on canvas */
:root{
  --bg:#1c0f0b;
  --fg:#fff4e6;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
</style>
<canvas id="c" aria-label="Hero Escape game"></canvas>
<script>
'use strict';
/* =====================================================================
   HERO ESCAPE — Level 1 greybox prototype
   Phase 1: Snake chase   (clear columns so the hero can run to the exit)
   Phase 2: Stone flood   (open a channel so the stones drain past the slab)
   Phase 3: Underwater    (carve a path up to the exit before air runs out)
   ===================================================================== */
const VW = 540, VH = 960;
const CFG = { relaxed: false, sound: true };
const TIMES = { snake: 50, slab: 50, oxygen: 70 };   // seconds, Normal mode
const mult = () => (CFG.relaxed ? 1.5 : 1);

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let dpr = 1, scale = 1, offX = 0, offY = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  scale = Math.min(w / VW, h / VH);
  offX = (w - VW * scale) / 2; offY = (h - VH * scale) / 2;
}
window.addEventListener('resize', resize); resize();
const view = () => ({ top: -offY / scale, bottom: VH + offY / scale, left: -offX / scale, right: VW + offX / scale });

// ---------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function star(g, x, y, R, fill) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * .45 : R; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  g.closePath(); g.fillStyle = fill; g.fill();
}

class Path {
  constructor(pts) {
    this.pts = pts; this.cum = [0];
    for (let i = 1; i < pts.length; i++) this.cum.push(this.cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    this.len = this.cum[this.cum.length - 1];
  }
  at(s) {
    const p = this.pts, n = p.length;
    let i;
    if (s <= 0) i = 1; else if (s >= this.len) i = n - 1;
    else { i = 1; while (this.cum[i] < s) i++; }
    const a = p[i - 1], b = p[i], L = this.cum[i] - this.cum[i - 1] || 1, k = (s - this.cum[i - 1]) / L;
    return { x: a[0] + (b[0] - a[0]) * k, y: a[1] + (b[1] - a[1]) * k, a: Math.atan2(b[1] - a[1], b[0] - a[0]) };
  }
}

// ---------- audio (WebAudio synth, no files)
let AC = null;
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'sine', vol = .12, slide = 0, delay = 0) {
  if (!AC || !CFG.sound) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + .05);
}
const SFX = {
  tick: n => tone(420 * Math.pow(1.09, n), .07, 'triangle', .07),
  pop: n => { for (let i = 0; i < Math.min(n, 7); i++) tone(520 * Math.pow(1.12, i), .12, 'sine', .1, 1.6, i * .035); },
  thud: () => tone(140, .12, 'triangle', .08, .6),
  lose: () => { tone(330, .3, 'sawtooth', .07, .7); tone(220, .5, 'sawtooth', .07, .5, .25); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', .1, 1, i * .11)),
  splash: () => tone(900, .4, 'sine', .06, .2),
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ---------- block art (cached sprites)
const COLORS = {
  red:    { base: '#e8262b', light: '#ff8a7a', dark: '#8f0d12' },
  yellow: { base: '#ffbf1a', light: '#fff09a', dark: '#b86c00' },
  blue:   { base: '#2068ff', light: '#8fbaff', dark: '#0b36a0' },
  green:  { base: '#2fcf3a', light: '#a8f79a', dark: '#117a19' },
};
const SPR = {};
function blockSprite(color, s) {
  const key = color + s; if (SPR[key]) return SPR[key];
  const k = 3, c = document.createElement('canvas'); c.width = c.height = s * k;
  const g = c.getContext('2d'); g.scale(k, k);
  const C = COLORS[color], cx = s / 2, cy = s / 2;
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(cx, cy + s * .37, s * .33, s * .07, 0, 0, 7); g.fill();
  g.beginPath();
  if (color === 'red') g.arc(cx, cy + s * .03, s * .38, 0, Math.PI * 2);
  else if (color === 'blue') rr(g, s * .12, s * .12, s * .76, s * .76, s * .18);
  else if (color === 'yellow') {
    for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; g.lineTo(cx + Math.cos(a) * s * .43, cy + Math.sin(a) * s * .43); }
    g.closePath();
  } else {
    g.moveTo(cx - s * .12, cy - s * .38); g.lineTo(cx + s * .12, cy - s * .38);
    g.quadraticCurveTo(cx + s * .16, cy - s * .18, cx + s * .3, cy - s * .06);
    g.quadraticCurveTo(cx + s * .44, cy + s * .1, cx + s * .38, cy + s * .3);
    g.quadraticCurveTo(cx, cy + s * .44, cx - s * .38, cy + s * .3);
    g.quadraticCurveTo(cx - s * .44, cy + s * .1, cx - s * .3, cy - s * .06);
    g.quadraticCurveTo(cx - s * .16, cy - s * .18, cx - s * .12, cy - s * .38); g.closePath();
  }
  const grd = g.createRadialGradient(cx - s * .12, cy - s * .15, s * .04, cx, cy, s * .5);
  grd.addColorStop(0, C.light); grd.addColorStop(.5, C.base); grd.addColorStop(1, C.dark);
  g.fillStyle = grd; g.fill(); g.lineWidth = s * .04; g.strokeStyle = C.dark; g.stroke();
  g.fillStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.ellipse(cx - s * .1, cy - s * .17, s * .13, s * .065, -.5, 0, 7); g.fill();
  if (color === 'red') {
    g.strokeStyle = '#5a3a12'; g.lineWidth = s * .05; g.beginPath(); g.moveTo(cx, cy - s * .3); g.lineTo(cx + s * .03, cy - s * .43); g.stroke();
    g.fillStyle = '#3fbf3a'; g.beginPath(); g.ellipse(cx + s * .12, cy - s * .4, s * .09, s * .045, -.4, 0, 7); g.fill();
  }
  return (SPR[key] = c);
}
function stoneSprite(R) {
  const key = 'stone' + R; if (SPR[key]) return SPR[key];
  const k = 3, c = document.createElement('canvas'); c.width = c.height = R * 2 * k;
  const g = c.getContext('2d'); g.scale(k, k);
  const grd = g.createRadialGradient(R * .7, R * .6, R * .1, R, R, R);
  grd.addColorStop(0, '#d6d3e4'); grd.addColorStop(.6, '#8f8aa6'); grd.addColorStop(1, '#4e4964');
  g.fillStyle = grd; g.beginPath(); g.arc(R, R, R * .97, 0, 7); g.fill();
  return (SPR[key] = c);
}

// ---------- particles
let parts = [];
function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 7), v = rand(80, 260);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0, max: rand(.35, .6), color, r: rand(3, 6), g: 600 });
  }
}
function splash(x, y) {
  for (let i = 0; i < 26; i++) parts.push({ x: x + rand(-14, 14), y, vx: rand(-140, 140), vy: rand(-420, -120), life: 0, max: rand(.5, .9), color: '#cdeeff', r: rand(2, 5), g: 900 });
  SFX.splash();
}
function updateParts(dt) {
  for (const p of parts) { p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.life < p.max);
}
function drawParts(g) {
  for (const p of parts) {
    g.globalAlpha = 1 - p.life / p.max; g.fillStyle = p.color;
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}

// ---------- block grid
// Match-3 board. Swap two touching blocks; a swap only sticks if it lines up 3+ of one colour.
// Boards are finite (no refill) because each phase is about emptying space for the hero.
const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];
class Grid {
  constructor(o) {
    Object.assign(this, o);
    this.valid = []; this.cells = [];
    for (let r = 0; r < this.rows; r++) {
      this.valid.push([]); this.cells.push([]);
      for (let c = 0; c < this.cols; c++) { this.valid[r].push(!!this.mask(r, c)); this.cells[r].push(null); }
    }
    for (let tries = 0; tries < 60; tries++) { this.fill(); if (this.findMove()) break; }
    this.popping = []; this.version = 0;
    this.state = 'idle'; this.anim = null; this.combo = 0;
  }
  // random colours, but never 3 in a row at the start
  fill() {
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      if (!this.valid[r][c]) continue;
      const bad = new Set(), L1 = this.get(r, c - 1), L2 = this.get(r, c - 2), U1 = this.get(r - 1, c), U2 = this.get(r - 2, c);
      if (L1 && L2 && L1.color === L2.color) bad.add(L1.color);
      if (U1 && U2 && U1.color === U2.color) bad.add(U1.color);
      const opts = this.colors.filter(k => !bad.has(k));
      this.cells[r][c] = { color: pick(opts.length ? opts : this.colors), oy: 0, vy: 0, sq: 0 };
    }
  }
  inside(r, c) { return r >= 0 && r < this.rows && c >= 0 && c < this.cols && this.valid[r][c]; }
  get(r, c) { return this.inside(r, c) ? this.cells[r][c] : null; }
  center(r, c) { return [this.x + (c + .5) * this.cell, this.y + (r + .5) * this.cell]; }
  cellAt(px, py) {
    const c = Math.floor((px - this.x) / this.cell), r = Math.floor((py - this.y) / this.cell);
    return this.inside(r, c) ? { r, c } : null;
  }
  // used by the underwater path search: 8-way so diagonal gaps count
  neighbors(r, c) {
    const out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++)
      if ((dr || dc) && this.inside(r + dr, c + dc)) out.push({ r: r + dr, c: c + dc });
    return out;
  }
  rawSwap(a, b) { const t = this.cells[a.r][a.c]; this.cells[a.r][a.c] = this.cells[b.r][b.c]; this.cells[b.r][b.c] = t; }
  runLen(r, c, dr, dc) {
    const b = this.get(r, c); let n = 0;
    for (let k = 1; ; k++) { const o = this.get(r + dr * k, c + dc * k); if (!o || o.color !== b.color) return n; n++; }
  }
  matchAt(r, c) {
    if (!this.get(r, c)) return false;
    return this.runLen(r, c, 0, -1) + this.runLen(r, c, 0, 1) >= 2 || this.runLen(r, c, -1, 0) + this.runLen(r, c, 1, 0) >= 2;
  }
  canSwap(a, b) {
    if (!this.inside(b.r, b.c) || !this.get(a.r, a.c)) return false;
    if (!this.get(b.r, b.c) && this.gravity) return false; // sliding into a gap only works without gravity
    this.rawSwap(a, b);
    const ok = this.matchAt(a.r, a.c) || this.matchAt(b.r, b.c);
    this.rawSwap(a, b);
    return ok;
  }
  findMove(priority) {
    let best = null, bestScore = Infinity;
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      if (!this.get(r, c)) continue;
      for (const [dr, dc] of DIRS) {
        const a = { r, c }, b = { r: r + dr, c: c + dc };
        if (!this.canSwap(a, b)) continue;
        if (!priority) return { a, b };
        const s = priority(r, c);
        if (s < bestScore) { bestScore = s; best = { a, b }; }
      }
    }
    return best;
  }
  findMatches() {
    const out = new Map();
    const scan = (r0, c0, dr, dc) => {
      let r = r0, c = c0;
      while (r < this.rows && c < this.cols) {
        const b = this.get(r, c);
        if (!b) { r += dr; c += dc; continue; }
        let n = 1; while (this.get(r + dr * n, c + dc * n) && this.get(r + dr * n, c + dc * n).color === b.color) n++;
        if (n >= 3) for (let k = 0; k < n; k++) out.set((r + dr * k) * 100 + c + dc * k, { r: r + dr * k, c: c + dc * k });
        r += dr * n; c += dc * n;
      }
    };
    for (let r = 0; r < this.rows; r++) scan(r, 0, 0, 1);
    for (let c = 0; c < this.cols; c++) scan(0, c, 1, 0);
    return [...out.values()];
  }
  trySwap(a, b) {
    if (this.state !== 'idle' || !this.inside(b.r, b.c) || !this.get(a.r, a.c)) return false;
    if (!this.get(b.r, b.c) && this.gravity) return false;
    const ok = this.canSwap(a, b);
    this.anim = { a, b, t: 0, dur: ok ? .16 : .32, ok }; this.state = 'swap';
    return ok;
  }
  smash(cell) {
    if (this.state !== 'idle' || !this.get(cell.r, cell.c)) return false;
    this.clear([cell]); this.state = 'cascade'; return true;
  }
  clear(list) {
    for (const { r, c } of list) {
      const b = this.cells[r][c]; if (!b) continue;
      const [cx, cy] = this.center(r, c);
      this.popping.push({ x: cx, y: cy + b.oy, color: b.color, t: 0 });
      burst(cx + this.wx, cy + b.oy + this.wy, COLORS[b.color].base, 7);
      this.cells[r][c] = null;
    }
    this.applyGravity(); this.version++;
  }
  applyGravity() {
    if (!this.gravity) return;
    for (let c = 0; c < this.cols; c++) {
      const rows = [];
      for (let r = this.rows - 1; r >= 0; r--) if (this.valid[r][c]) rows.push(r);
      const blocks = [];
      for (const r of rows) if (this.cells[r][c]) blocks.push({ b: this.cells[r][c], r });
      rows.forEach(r => (this.cells[r][c] = null));
      blocks.forEach((o, i) => { const tr = rows[i]; o.b.oy += (o.r - tr) * this.cell; this.cells[tr][c] = o.b; });
    }
  }
  settled() { for (const row of this.cells) for (const b of row) if (b && b.oy < 0) return false; return true; }
  resolve() {
    const m = this.findMatches();
    if (m.length) { this.combo++; this.clear(m); gridEvent(this, 'match', m.length, this.combo); this.state = 'cascade'; return; }
    this.state = 'idle'; this.combo = 0; this.afterMove();
  }
  // keep the board solvable: stranded blocks crumble, a dead board reshuffles
  afterMove() {
    if (!this.count()) return;
    if (this.gravity) {
      const lone = [];
      for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++)
        if (this.get(r, c) && !DIRS.some(([dr, dc]) => this.get(r + dr, c + dc))) lone.push({ r, c });
      if (lone.length) { this.clear(lone); gridEvent(this, 'crumble', lone.length); this.state = 'cascade'; return; }
    }
    if (this.findMove()) return;
    if (this.shuffle()) { gridEvent(this, 'shuffle'); this.state = 'cascade'; return; }
    const tally = {};
    for (const row of this.cells) for (const b of row) if (b) tally[b.color] = (tally[b.color] || 0) + 1;
    const fewest = Object.keys(tally).sort((x, y) => tally[x] - tally[y])[0], list = [];
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) if (this.get(r, c) && this.get(r, c).color === fewest) list.push({ r, c });
    this.clear(list); gridEvent(this, 'crumble', list.length); this.state = 'cascade';
  }
  shuffle() {
    const pos = [], cols = [];
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) if (this.get(r, c)) { pos.push({ r, c }); cols.push(this.get(r, c).color); }
    const assign = () => {
      for (let i = cols.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [cols[i], cols[j]] = [cols[j], cols[i]]; }
      pos.forEach((p, i) => { const b = this.cells[p.r][p.c]; b.color = cols[i]; b.sq = 1; });
    };
    for (let t = 0; t < 60; t++) { assign(); if (!this.findMatches().length && this.findMove()) return true; }
    for (let t = 0; t < 60; t++) { assign(); if (this.findMatches().length || this.findMove()) return true; }
    return false;
  }
  colEmpty(c) { for (let r = 0; r < this.rows; r++) if (this.valid[r][c] && this.cells[r][c]) return false; return true; }
  count() { let n = 0; for (const row of this.cells) for (const b of row) if (b) n++; return n; }
  update(dt) {
    for (const row of this.cells) for (const b of row) {
      if (!b) continue;
      if (b.oy < 0) { b.vy += 2800 * dt; b.oy += b.vy * dt; if (b.oy >= 0) { b.oy = 0; b.vy = 0; b.sq = 1; } }
      if (b.sq > 0) b.sq = Math.max(0, b.sq - dt * 5);
    }
    for (const p of this.popping) p.t += dt;
    this.popping = this.popping.filter(p => p.t < .22);
    if (this.state === 'swap') {
      const A = this.anim; A.t += dt;
      if (A.t >= A.dur) { this.anim = null; if (A.ok) { this.rawSwap(A.a, A.b); this.combo = 0; this.resolve(); } else this.state = 'idle'; }
    } else if (this.state === 'cascade' && this.settled() && !this.popping.length) this.resolve();
  }
  drawTray(g, rim, fill) {
    const s = this.cell;
    g.fillStyle = rim;
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++)
      if (this.valid[r][c]) g.fillRect(this.x + c * s - 6, this.y + r * s - 6, s + 12, s + 12);
    g.fillStyle = fill;
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++)
      if (this.valid[r][c]) g.fillRect(this.x + c * s, this.y + r * s, s, s);
  }
  drawBlocks(g, sel) {
    const s = this.cell, A = this.anim;
    const skip = (r, c) => A && ((A.a.r === r && A.a.c === c) || (A.b.r === r && A.b.c === c));
    const drawOne = (b, cx, cy, big) => {
      const sx = (big ? 1.1 : 1) * (1 + b.sq * .12), sy = (big ? 1.1 : 1) * (1 - b.sq * .12);
      g.drawImage(blockSprite(b.color, s), cx - s / 2 * sx, cy - s / 2 * sy + (1 - sy) * s * .4, s * sx, s * sy);
    };
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      const b = this.cells[r][c]; if (!b || skip(r, c)) continue;
      const [cx, cy] = this.center(r, c), isSel = sel && sel.r === r && sel.c === c;
      if (isSel) { g.fillStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.arc(cx, cy, s * .5 + Math.sin(G.time * 8) * 2, 0, 7); g.fill(); }
      drawOne(b, cx, cy + b.oy, isSel);
    }
    if (A) {
      const k = A.ok ? ease(Math.min(1, A.t / A.dur)) : Math.sin(Math.PI * Math.min(1, A.t / A.dur)) * .4;
      const pa = this.center(A.a.r, A.a.c), pb = this.center(A.b.r, A.b.c);
      const ba = this.cells[A.a.r][A.a.c], bb = this.cells[A.b.r][A.b.c];
      if (bb) drawOne(bb, lerp(pb[0], pa[0], k), lerp(pb[1], pa[1], k), false);
      if (ba) drawOne(ba, lerp(pa[0], pb[0], k), lerp(pa[1], pb[1], k), true);
    }
    for (const p of this.popping) {
      const k = p.t / .22, sc = 1 + k * .6;
      g.globalAlpha = 1 - k;
      g.drawImage(blockSprite(p.color, s), p.x - s / 2 * sc, p.y - s / 2 * sc, s * sc, s * sc);
    }
    g.globalAlpha = 1;
  }
}

// ---------- hero (placeholder art for your own character)
const hero = { x: 48, y: 880, pose: 'scared', face: 1, visible: true, inCart: false, tilt: 0 };
function drawHero(g, T) {
  if (!hero.visible) return;
  const { pose, face } = hero;
  g.save(); g.translate(hero.x, hero.y);
  if (hero.inCart) g.translate(0, -12);
  if (pose === 'swim') { g.translate(0, -36); g.rotate(Math.sin(T * 2.2) * .18 + hero.tilt); g.translate(0, 36); }
  if (pose === 'fall') { g.translate(0, -36); g.rotate(Math.sin(T * 9) * .3); g.translate(0, 36); }
  g.scale(face, 1);
  const walk = pose === 'walk' ? Math.sin(T * 15) : 0;
  const bob = pose === 'walk' ? -Math.abs(Math.sin(T * 15)) * 3 : pose === 'scared' ? Math.sin(T * 40) * .8 : Math.sin(T * 3);
  g.lineCap = 'round'; g.lineJoin = 'round';
  // cape
  g.fillStyle = '#c81d2b';
  g.beginPath(); g.moveTo(-6, -46 + bob);
  g.quadraticCurveTo(-26 - Math.sin(T * 6) * 4, -30 + bob, -22 - Math.sin(T * 5) * 6, -12);
  g.lineTo(6, -16 + bob); g.closePath(); g.fill();
  // legs
  g.strokeStyle = '#1b2550'; g.lineWidth = 8;
  let k1 = walk * 7, k2 = -walk * 7;
  if (pose === 'swim' || pose === 'fall') { k1 = Math.sin(T * 7) * 6; k2 = -k1; }
  if (pose === 'push') { k1 = -8; k2 = -2; }
  g.beginPath(); g.moveTo(-5, -20 + bob); g.lineTo(-5 + k1, -4); g.moveTo(5, -20 + bob); g.lineTo(5 + k2, -4); g.stroke();
  g.fillStyle = '#111'; g.beginPath(); g.ellipse(-3 + k1, -2, 6, 3.5, 0, 0, 7); g.ellipse(7 + k2, -2, 6, 3.5, 0, 0, 7); g.fill();
  // body
  g.fillStyle = '#2459d6'; rr(g, -13, -47 + bob, 26, 30, 9); g.fill();
  g.fillStyle = '#1a3f9c'; g.fillRect(-13, -24 + bob, 26, 4);
  star(g, 0, -34 + bob, 7, '#ffd23a');
  // arms
  g.strokeStyle = '#f0bf95'; g.lineWidth = 6;
  const sh = -41 + bob;
  g.beginPath();
  if (pose === 'push') { g.moveTo(6, sh); g.lineTo(24, sh - 4); g.moveTo(-4, sh + 3); g.lineTo(22, sh + 6); }
  else if (pose === 'scared') { const w = Math.sin(T * 30) * 2; g.moveTo(-10, sh); g.lineTo(-20 + w, sh - 18); g.moveTo(10, sh); g.lineTo(20 - w, sh - 18); }
  else if (pose === 'cheer') { g.moveTo(-10, sh); g.lineTo(-18, sh - 22); g.moveTo(10, sh); g.lineTo(18, sh - 22); }
  else if (pose === 'swim' || pose === 'fall') { const w = Math.sin(T * 6) * 9; g.moveTo(-10, sh); g.lineTo(-24, sh - 6 + w); g.moveTo(10, sh); g.lineTo(26, sh - 6 - w); }
  else if (pose === 'walk') { g.moveTo(-9, sh); g.lineTo(-12 - walk * 7, sh + 15); g.moveTo(9, sh); g.lineTo(12 + walk * 7, sh + 15); }
  else { g.moveTo(-10, sh); g.lineTo(-13, sh + 16); g.moveTo(10, sh); g.lineTo(13, sh + 16); }
  g.stroke();
  // head
  const hy = -64 + bob;
  g.fillStyle = '#f3c49c'; g.beginPath(); g.arc(1, hy, 16, 0, 7); g.fill();
  g.fillStyle = '#3a2214';
  g.beginPath(); g.arc(-1, hy - 3, 17, Math.PI * 1.02, Math.PI * 1.98); g.quadraticCurveTo(10, hy - 26, -4, hy - 22); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-14, hy - 8); g.lineTo(-20, hy - 22); g.lineTo(-6, hy - 16); g.fill();
  // face
  const wide = pose === 'scared' || pose === 'fall';
  g.fillStyle = '#fff';
  g.beginPath(); g.ellipse(4, hy - 1, 3.6, wide ? 5 : 4, 0, 0, 7); g.ellipse(12, hy - 1, 3.2, wide ? 4.6 : 3.8, 0, 0, 7); g.fill();
  g.fillStyle = '#1a1a1a'; g.beginPath(); g.arc(5, hy, 2, 0, 7); g.arc(13, hy, 1.8, 0, 7); g.fill();
  g.strokeStyle = '#7a3a2a'; g.lineWidth = 2;
  if (wide) { g.fillStyle = '#5a1a1a'; g.beginPath(); g.ellipse(9, hy + 8, 2.6, 3.4, 0, 0, 7); g.fill(); }
  else if (pose === 'push') { g.beginPath(); g.moveTo(5, hy + 8); g.lineTo(13, hy + 8); g.stroke(); }
  else { g.beginPath(); g.arc(9, hy + 5, 4, .2, Math.PI - .2); g.stroke(); }
  g.restore();
  if (hero.inCart) drawCart(g, hero.x, hero.y);
}
function drawCart(g, x, y) {
  g.save(); g.translate(x, y);
  g.fillStyle = '#6b4226'; g.beginPath(); g.moveTo(-30, -30); g.lineTo(30, -30); g.lineTo(24, -4); g.lineTo(-24, -4); g.closePath(); g.fill();
  g.strokeStyle = '#3d2412'; g.lineWidth = 3; g.stroke();
  g.strokeStyle = '#8c5a35'; g.beginPath(); g.moveTo(-27, -20); g.lineTo(27, -20); g.stroke();
  g.fillStyle = '#2b2b2b'; g.beginPath(); g.arc(-15, -2, 7, 0, 7); g.arc(15, -2, 7, 0, 7); g.fill();
  g.restore();
}

// ---------- snake
function drawSnake(g, path, s, T) {
  const N = 34, sp = 13, segs = [];
  for (let i = N; i >= 0; i--) {
    const p = path.at(s - i * sp + Math.sin(T * 4 + i * .5) * 1.5);
    segs.push({ ...p, r: 27 * (1 - (i / N) * .62), i });
  }
  g.fillStyle = '#123d18';
  for (const q of segs) { g.beginPath(); g.arc(q.x, q.y, q.r + 3, 0, 7); g.fill(); }
  for (const q of segs) {
    g.fillStyle = q.i % 2 ? '#2f8a33' : '#3aa03c';
    g.beginPath(); g.arc(q.x, q.y, q.r, 0, 7); g.fill();
    g.fillStyle = 'rgba(190,255,150,.35)'; g.beginPath(); g.arc(q.x - q.r * .25, q.y - q.r * .3, q.r * .45, 0, 7); g.fill();
  }
  const h = path.at(s);
  g.save(); g.translate(h.x, h.y); g.rotate(h.a);
  if (Math.sin(T * 5) > .55) {
    g.strokeStyle = '#d0213a'; g.lineWidth = 3; g.beginPath(); g.moveTo(30, 0); g.lineTo(46, 0); g.lineTo(52, -5); g.moveTo(46, 0); g.lineTo(52, 5); g.stroke();
  }
  g.fillStyle = '#123d18'; g.beginPath(); g.ellipse(8, 0, 36, 26, 0, 0, 7); g.fill();
  g.fillStyle = '#3aa03c'; g.beginPath(); g.ellipse(8, 0, 33, 23, 0, 0, 7); g.fill();
  g.fillStyle = '#e9d23a'; g.beginPath(); g.ellipse(18, -13, 8, 6, 0, 0, 7); g.ellipse(18, 13, 8, 6, 0, 0, 7); g.fill();
  g.fillStyle = '#111'; g.beginPath(); g.ellipse(20, -13, 2, 5, 0, 0, 7); g.ellipse(20, 13, 2, 5, 0, 0, 7); g.fill();
  g.fillStyle = '#0d2a10'; g.beginPath(); g.arc(36, -5, 2, 0, 7); g.arc(36, 5, 2, 0, 7); g.fill();
  g.restore();
}

}

// ---- scripted sequences

    update(k, dt) {

const waitStep = dur => ({ dur });
function seq12() {
  return [
    doStep(() => { hero.pose = 'cheer'; caption('Phew! Jump in the minecart!', 2.4); }),
    waitStep(.5),
    pathStep([[hero.x, 880], [600, 880]], 200, { pose: 'walk' }),
    doStep(() => (hero.visible = false)),
    camStep(960, 1.1),
    doStep(() => { hero.visible = true; hero.pose = 'idle'; }),
    pathStep(TRACK2, 420, { cart: true, pose: 'idle' }),

function seq23() {

    doStep(() => { hero.pose = 'cheer'; caption('The stones are gone! Dive into the water!', 2.6); }),
    waitStep(.8),
    pathStep([[hero.x, hero.y], [55, hero.y]], 160, { pose: 'walk' }),
    pathStep([[55, 1840], [55, 1960]], 520, { pose: 'fall', follow: [960, 1920, 380] }),
    doStep(() => splash(55, 1922)),
    pathStep([[55, 1960], [70, 2300], [300, 2720]], 260, { pose: 'swim', follow: [1920, 1920, 0] }),

function seqWin() {

  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (captionObj) { captionObj.t += dt; if (captionObj.t > captionObj.dur) captionObj = null; }
  if (G.state === 'play') {
    G.phaseT += dt;
    for (const t of timers) { t.t -= dt; if (t.t <= 0 && !t.done) { t.done = 1; if (t.epoch === G.epoch) t.fn(); } }
    timers = timers.filter(t => !t.done);
  }
  if (G.state === 'seq') updateSeq(dt);
  PHASES.forEach((P, i) => P.grid && P.update(dt, G.state === 'play' && G.phase === i));
  updateParts(dt);
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - lastT) / 1000); lastT = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
// title screen shows the level behind it
PHASES.forEach(p => p.init()); P1.placeHero();
window.HeroEscape = { G, PHASES, hero, startLevel, phaseWon };
requestAnimationFrame(frame);
</script>
